<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --fg: CanvasText;
    --line: color-mix(in srgb, CanvasText 25%, Canvas);
    --muted: color-mix(in srgb, CanvasText 55%, Canvas);
  }
  body {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0; padding: 1rem;
    background: var(--bg); color: var(--fg);
    max-width: 60rem;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); margin: 0 0 1rem; padding: .75rem; }
  legend { color: var(--muted); padding: 0 .35rem; }
  label { display: block; margin-bottom: .5rem; }
  input, button, select {
    font: inherit; padding: .35rem .5rem;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
  }
  input { width: 100%; max-width: 24rem; }
  button { cursor: pointer; }
  #log {
    border: 1px solid var(--line); height: 24rem;
    overflow-y: auto; padding: .5rem; margin-bottom: .5rem;
  }
  .msg { margin-bottom: .25rem; word-wrap: break-word; }
  .who { font-weight: 600; }
  .at { color: var(--muted); font-size: .85em; }
  .sys { color: var(--muted); font-style: italic; }
  .err { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .err { color: #ff6b5a; } }
  .attachments { margin: .2rem 0 .4rem 1.5rem; }
  .attachments a { display: inline-block; padding: .2rem .5rem;
    border: 1px solid var(--line); margin-right: .3rem; color: inherit; }
  .attachments img, .attachments video { max-width: 20rem; max-height: 15rem;
    display: block; border: 1px solid var(--line); margin-top: .3rem; }
  #pending { color: var(--muted); font-size: .85em; margin-bottom: .3rem; }

  #gifPanel { border: 1px solid var(--line); padding: .5rem; margin-bottom: .5rem; }
  #gifPanel[hidden] { display: none; }
  #gifGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
    gap: .4rem; max-height: 18rem; overflow-y: auto; margin-top: .5rem; }
  #gifGrid img { width: 100%; height: 7rem; object-fit: cover;
    cursor: pointer; border: 1px solid var(--line); background: #000; }
  #gifGrid img:hover { border-color: CanvasText; }
  #gifCredit { color: var(--muted); font-size: .8em; margin-top: .4rem; }
  #composer { display: flex; gap: .5rem; }
  #composer input { flex: 1; max-width: none; }
  #status { color: var(--muted); margin-left: .5rem; }
  #whoami { color: var(--muted); margin-left: .5rem; font-weight: 400; }
  #participants { list-style: none; margin: .5rem 0 0; padding: 0; }
  #participants li { padding: .15rem 0; }
  .speaking { font-weight: 600; }
  .ptt-hint { color: var(--muted); font-size: .85em; }

  .msg code { background: color-mix(in srgb, CanvasText 12%, Canvas);
    padding: .05rem .25rem; border-radius: 3px; }
  .msg pre { background: color-mix(in srgb, CanvasText 12%, Canvas);
    padding: .4rem .6rem; overflow-x: auto; margin: .25rem 0; }
  .msg pre code { background: none; padding: 0; }
  .msg blockquote { border-left: 3px solid var(--line); margin: .25rem 0;
    padding-left: .5rem; color: var(--muted); }
  .msg a { color: inherit; }
  .msg .acts { visibility: hidden; margin-left: .4rem; }
  .msg:hover .acts { visibility: visible; }
  .msg .acts button { font-size: .75em; padding: 0 .3rem; }

  #modPanel { border: 1px solid var(--line); padding: .5rem; margin-bottom: .5rem; }
  #modPanel[hidden] { display: none; }
  #modList { max-height: 18rem; overflow-y: auto; margin-top: .5rem; }
  .report { border-bottom: 1px solid var(--line); padding: .4rem 0; }
  .report .meta { color: var(--muted); font-size: .85em; }
  .report .quoted { border-left: 3px solid var(--line); padding-left: .5rem;
    margin: .25rem 0; white-space: pre-wrap; }
  .ok { color: #1a7f37; }
  .bad { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .ok { color: #4ac26b; } .bad { color: #ff6b5a; } }

  .preview { border: 1px solid var(--line); border-left-width: 3px;
    margin: .25rem 0 .5rem 1.5rem; padding: .4rem .6rem; max-width: 34rem; }
  .preview .site { color: var(--muted); font-size: .8em; }
  .preview .title { font-weight: 600; }
  .preview .desc { color: var(--muted); font-size: .9em; }
  .preview img { max-width: 100%; margin-top: .4rem; display: block; }
  .preview .embed { position: relative; cursor: pointer; margin-top: .4rem; }
  .preview .embed .play { position: absolute; inset: 0; display: grid;
    place-items: center; font-size: 2rem; color: #fff;
    background: rgba(0,0,0,.35); }
  .preview iframe { width: 100%; aspect-ratio: 16/9; border: 0; margin-top: .4rem; }
  #screens { display: grid; gap: .5rem; margin-top: .5rem; }
  #screens figure { margin: 0; border: 1px solid var(--line); position: relative; }
  #screens video { width: 100%; display: block; background: #000; }
  #screens figcaption { padding: .25rem .5rem; color: var(--muted); font-size: .85em;
    display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
  /* Overlaid rather than in the caption so it stays visible in
     fullscreen, which is exactly when you want to read it. */
  #screens .stats {
    position: absolute; top: .4rem; left: .4rem; z-index: 1;
    font-variant-numeric: tabular-nums; font-size: .8rem;
    background: rgba(0,0,0,.65); color: #fff;
    padding: .15rem .4rem; border-radius: 3px;
    pointer-events: none;
  }
  #screens button { font-size: .85em; padding: .1rem .4rem; }
  #screens video { cursor: zoom-in; }
  #screens figure:fullscreen video { height: 100vh; object-fit: contain; cursor: zoom-out; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .5rem; }
  .row label { margin: 0; }
  .num { width: 6rem; }
  #customBox[hidden] { display: none; }
</style>

<body>

<h1>OpenVoxa debug client <span id="status">disconnected</span> <span id="whoami"></span></h1>

<fieldset>
  <legend>sign in</legend>
  <label>username <input id="username" value="ryan" autocomplete="username"></label>

  <button id="register">Register</button>
  <button id="deleteAccount" disabled>Delete account</button>

</fieldset>

<fieldset>
  <legend>crypto</legend>
  <div class="row">
    <button id="mlsSelfTest">Run MLS self-test</button>
    <button id="idRefresh" disabled>Refresh key packages</button>
    <button id="idForget" disabled>Forget this device</button>
    <span id="mlsStatus" class="ptt-hint"></span>
  </div>
  <div id="idStatus" class="ptt-hint"></div>
  <div id="mlsOutput" class="ptt-hint"></div>
</fieldset>

<fieldset>
  <legend>channel</legend>
  <select id="channel"></select>
  <button id="connect" disabled>Connect</button>
  <button id="disconnect" disabled>Disconnect</button>

</fieldset>

  <select id="voiceChannel"></select>
  <button id="joinVoice" disabled>Join</button>
  <button id="leaveVoice" disabled>Leave</button>
  <button id="muteToggle" disabled>Mute</button>

  <label style="margin-top:.5rem">

    <span class="ptt-hint">(hold Space while this page has focus)</span>

</fieldset>

<fieldset>
  <legend>screen share</legend>

  <div class="row">
    <select id="preset">
      <option value="1280x720x30x2500">720p 30fps</option>

  <div class="row">

    <strong style="flex:1">Moderation</strong>

</div>

  <div class="row">
    <input id="gifQuery" placeholder="Search GIFs" autocomplete="off" style="flex:1">
    <button id="gifSearch">Search</button>
    <button id="gifClose">Close</button>

  <div id="gifGrid"></div>

</div>

  <input id="body" placeholder="Message" disabled autocomplete="off">
  <input type="file" id="file" multiple hidden>
  <button id="attach" disabled>Attach</button>
  <button id="gif" disabled hidden>GIF</button>
  <button id="send" disabled>Send</button>
</div>

<script>
const api = location.origin;
let token = null;
let socket = null;
let currentChannel = null;
let currentChannelEncrypted = false;
let myUserID = null;
let session = null;

const $ = (id) => document.getElementById(id);
const logEl = $("log");

function line(cls, html) {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = html;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

// Everything from the server is treated as untrusted text. Message bodies
// are other people's input and must never be injected as HTML.
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

// ----------------------------------------------------------- attachments

let pending = [];

function renderPending() {
  $("pending").textContent = pending.length
    ? "attached: " + pending.map((a) => `${a.filename} (${fmtSize(a.size)})`).join(", ")
    : "";
}

function fmtSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

async function upload(files) {
  for (const file of files) {
    const form = new FormData();

    // In an encrypted channel the file is encrypted here with its own
    // key, and the server gets ciphertext under a placeholder name. The
    // key, real name and real type ride inside the MLS message that
    // claims the upload (see send()).
    let fileKey = null;
    if (currentChannelEncrypted) {
      if (!session || !session.groups.isMember(currentChannel)) {
        line("err", "this device has not been added to this channel yet");
        return;
      }
      const enc = await OpenVoxaCore.encryptFile(
        await file.arrayBuffer(), file.name, file.type);
      fileKey = enc.key;
      form.append("file", new Blob([enc.ciphertext]), "encrypted");
    } else {
      form.append("file", file);
    }

    // Deliberately not using call(): FormData must set its own
    // Content-Type, including the multipart boundary.
    const res = await fetch(`${api}/api/v1/channels/${currentChannel}/attachments`, {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: form
    });

    if (!res.ok) {
      const data = await res.json().catch(() => null);
      line("err", esc(data?.error || `upload failed: ${file.name}`));
      continue;
    }

    const info = await res.json();
    if (fileKey) {
      // Show the real name and size locally; the server's are placeholders.
      pending.push({ ...info, filename: file.name, size: file.size,
                     fileKey: { ...fileKey, id: info.id } });
    } else {
      pending.push(info);
    }
    renderPending();
  }
}

// Types the server would serve inline. The decrypted copy obeys the same
// list: anything else becomes an octet-stream download, never a page.
const PREVIEWABLE = new Set([
  "image/png", "image/jpeg", "image/gif", "image/webp",
  "audio/mpeg", "audio/ogg", "audio/wav", "video/mp4", "video/webm",
]);

/**
 * Fetch an encrypted attachment and return a blob: URL of the plaintext.
 *
 * A blob: URL belongs to this page's origin. Typed text/html and opened
 * in a tab, it would run script as us, which is exactly the stored-XSS
 * the server's allowlist prevents. So the type comes from the allowlist,
 * not from the sender, and everything else is an octet-stream.
 */
async function decryptToURL(at, fk) {
  const res = await fetch(api + at.url);
  if (!res.ok) throw new Error(`download failed (${res.status})`);
  const plain = await OpenVoxaCore.decryptFile(await res.arrayBuffer(), fk);
  const type = PREVIEWABLE.has(fk.type) ? fk.type : "application/octet-stream";
  return URL.createObjectURL(new Blob([plain], { type }));
}

function renderEncryptedAttachments(box, list, files) {
  const keys = new Map((files || []).map((f) => [f.id, f]));

  for (const at of list) {
    const fk = keys.get(at.id);

    // No key, and the server did not store it as ciphertext: a provider
    // GIF, which is public content kept unencrypted on purpose.
    if (!fk && !(at.filename === "encrypted" &&
                 at.content_type === "application/octet-stream")) {
      renderPlainAttachment(box, at);
      continue;
    }

    if (!fk) {
      // Ciphertext whose key is in a message this device cannot read.
      const span = document.createElement("span");
      span.textContent = "[encrypted attachment]";
      box.appendChild(span);
      continue;
    }

    const link = document.createElement("a");
    link.href = "#";
    link.textContent = `${fk.name} (${fmtSize(fk.size)})`;
    box.appendChild(link);

    let urlPromise = null;
    const getURL = () => (urlPromise ??= decryptToURL(at, fk));

    // download= rather than target=_blank: saving never navigates, so
    // the blob is never rendered as a document on our origin.
    link.onclick = async (e) => {
      e.preventDefault();
      try {
        const a = document.createElement("a");
        a.href = await getURL();
        a.download = fk.name;
        a.click();
      } catch (err) {
        link.textContent = `${fk.name} (could not decrypt: ${err.message})`;
      }
    };

    if (!PREVIEWABLE.has(fk.type)) continue;

    const kind = fk.type.split("/")[0];
    const el = document.createElement(kind === "image" ? "img" : kind);
    if (kind === "image") el.alt = fk.name;
    else el.controls = true;
    box.appendChild(el);

    // Previews decrypt straight away, which means downloading the whole
    // file: GCM cannot be streamed into a <video> without chunking.
    getURL().then((u) => { el.src = u; }).catch((err) => {
      el.remove();
      link.textContent = `${fk.name} (could not decrypt: ${err.message})`;
    });
  }
}

// An attachment the server stored as-is: anything in a plaintext
// channel, and provider GIFs in any channel.
function renderPlainAttachment(box, at) {
  // Signed by the server and already time-limited, so it works in an
  // <img src> where an Authorization header cannot be sent.
  const url = api + at.url;

  const link = document.createElement("a");
  link.href = url;
  link.textContent = `${at.filename} (${fmtSize(at.size)})`;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  box.appendChild(link);

  // Only preview types the server is willing to serve inline. Anything
  // else stays a download link, which is what stops an uploaded HTML
  // file from executing against our own origin.
  if (/^image\//.test(at.content_type) && at.content_type !== "image/svg+xml") {
    const img = document.createElement("img");
    img.src = url;
    img.alt = at.filename;
    box.appendChild(img);
  } else if (/^video\//.test(at.content_type)) {
    const vid = document.createElement("video");
    vid.src = url;
    vid.controls = true;
    box.appendChild(vid);
  } else if (/^audio\//.test(at.content_type)) {
    const aud = document.createElement("audio");
    aud.src = url;
    aud.controls = true;
    box.appendChild(aud);
  }
}

function renderAttachments(after, list, files) {
  if (!list || !list.length) return;

  const box = document.createElement("div");
  box.className = "attachments";

  if (currentChannelEncrypted) {
    renderEncryptedAttachments(box, list, files);
    after.insertAdjacentElement("afterend", box);
    return;
  }

  for (const at of list) renderPlainAttachment(box, at);

  after.insertAdjacentElement("afterend", box);
  logEl.scrollTop = logEl.scrollHeight;
}

// ---------------------------------------------------------------- crypto
//
// Nothing here is wired into messaging yet. This proves the client-core
// bundle loads, that MLS runs in this browser, and that a group can be
// created, joined and used - before any of it is load-bearing.

// ---------------------------------------------------------- encryption
//
// In an encrypted channel the message body on the wire is base64 of MLS
// ciphertext. The server stores those bytes and cannot read them.
//
// Base64 inside a text field costs about a third in storage. Worth
// replacing with a binary frame eventually; not worth a protocol change
// while the shape is still moving.

function b64encode(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary);
}

function b64decode(text) {
  const binary = atob(text);
  const out = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) out[i] = binary.charCodeAt(i);
  return out;
}

/**
 * Turn a received message into something renderable.
 *
 * A message this device cannot read is normal rather than broken:
 * anything sent before this device joined is undecryptable by design.
 * It is shown as unreadable instead of being hidden, so the gap in the
 * conversation is visible rather than silently papered over.
 */
// Plaintext of messages sent from here but not yet echoed back, oldest
// first. The server broadcasts in order, so the first echo from this
// account matches the first entry.
const awaitingEcho = [];

// Every received message, history or live, goes through one queue.
// Decryption reads and rewrites the stored group state, so two running
// at once can each start from the same state and the later save
// silently discards the earlier one's ratchet progress. The queue also
// keeps rendering in arrival order and keeps own-message echoes matched
// to the right entry in awaitingEcho.
let inbound = Promise.resolve();

function enqueueInbound(m) {
  inbound = inbound
    .then(() => prepareMessage(m))
    .then(renderMessage)
    .catch((err) => line("err", esc(`could not show a message: ${err.message}`)));
}

async function prepareMessage(m) {
  if (!currentChannelEncrypted || !m.body) return m;

  // A deleted message must not survive in the local archive either.
  if (m.deleted) {
    await OpenVoxaCore.storage.deletePlaintext(m.id);
    return m;
  }

  // Plaintext is an envelope: the text plus any attachment keys. Older
  // messages are bare text, which decodeEnvelope passes through.
  const opened = (plain) => {
    const env = OpenVoxaCore.decodeEnvelope(plain);
    return { ...m, body: env.text, files: env.files };
  };

  // Our own message coming back from the server. MLS senders cannot read
  // their own application messages, so the plaintext comes from the send
  // queue instead.
  const own = m.author_id && m.author_id === myUserID;
  if (own) {
    const queued = awaitingEcho.shift();
    if (queued !== undefined) {
      await OpenVoxaCore.storage.putPlaintext(m.id, queued);
      return opened(queued);
    }
  }

  // Anything this device has read or sent before. This has to come
  // before decryption, not after: MLS deletes each message key once it
  // is used, so the second attempt at the same ciphertext always fails.
  const saved = await OpenVoxaCore.storage.getPlaintext(m.id);
  if (saved !== undefined) return opened(saved);

  if (own) return { ...m, body: "[sent from another device]", unreadable: true };

  if (!session || !session.groups.isMember(currentChannel)) {
    return { ...m, body: "[encrypted]", unreadable: true };
  }

  try {
    const plaintext = await session.groups.decrypt(currentChannel, b64decode(m.body));
    if (!plaintext) {
      // Either it predates this device joining, or it was read before
      // the local archive existed and its key is gone. The two cannot be
      // told apart from here, so the label does not pretend to.
      return { ...m, body: "[not readable on this device]", unreadable: true };
    }
    const text = new TextDecoder().decode(plaintext);
    await OpenVoxaCore.storage.putPlaintext(m.id, text);
    return opened(text);
  } catch {
    return { ...m, body: "[could not decrypt]", unreadable: true };
  }
}

/**
 * Open the MLS group for a channel, reporting what happened.
 *
 * Status goes to its own element rather than the message log, because
 * loading history clears the log and would wipe it a moment later.
 */
function cryptoStatus(text) {
  const el = $("cryptoStatus");
  if (el) el.textContent = text;
}

async function openGroup(channelId) {
  if (!session) {
    cryptoStatus("no crypto session; sign in again");
    return false;
  }

  const result = await session.groups.open(channelId);

  switch (result.status) {
    case "created":
      if (result.replaced) {
        cryptoStatus(`encrypted: started a new group (epoch ${result.epoch})`);
        // Held like a membership notice: loading history clears the log.
        noticeLine("nobody with access could update this channel's old encryption group, " +
          "so this device replaced it with a new one. Messages from before can't be read " +
          "by devices that hadn't already decrypted them.");
      } else {
        cryptoStatus(`encrypted: created this channel's group (epoch ${result.epoch})`);
      }
      return true;
    case "joined":
      cryptoStatus(result.via === "external"
        ? `encrypted: joined from the published group info (epoch ${result.epoch})`
        : `encrypted: joined the group (epoch ${result.epoch})`);
      if (result.replaced) {
        noticeLine("this channel's encryption group was replaced since this device last " +
          "used it; messages it hadn't already decrypted can't be read");
      }
      return true;
    case "ready":
      cryptoStatus(`encrypted: ready (epoch ${result.epoch})`);
      return true;
    case "awaiting_invite":
      cryptoStatus(result.detail || "waiting to be added to this channel");
      return false;
    default:
      cryptoStatus(result.detail || "could not open the encrypted group");
      return false;
  }
}

// ------------------------------------------------- automatic membership
//
// Membership follows channel access (decisions.md, Encryption). The
// server only says who belongs; this device's client commits the
// difference, in the background, whenever there is a hint that the
// group may be out of date. client-core coalesces the hints and staggers
// members so only one of them normally does the work.

/** Removed from a group: a normal event, not an error. */
function isRemoved(err) {
  return err instanceof OpenVoxaCore.RemovedFromGroup ||
    err?.name === "RemovedFromGroup" || err?.name === "GroupReset";
}

/** Out because the whole group was replaced, not because access was lost. */
function isReset(err) {
  return err?.name === "GroupReset";
}

/** Ask for a background reconcile of every group this page has open. */
function reconcileOpenGroups() {
  if (!session) return;
  if (currentChannelEncrypted && currentChannel && session.groups.isMember(currentChannel)) {
    session.groups.reconcileSoon(currentChannel);
  }
  if (voiceChannelId && session.groups.isMember(voiceChannelId)) {
    session.groups.reconcileSoon(voiceChannelId);
  }
}

const short = (id) => esc(String(id).slice(0, 8));

// Skipped devices are reported again on every run until they publish key
// packages. Only say so when the list changes.
const lastSkipped = new Map();

function onAutoReconcile(ev) {
  const where = ev.channelId === voiceChannelId ? "voice" : "channel";

  if (ev.kind === "removed") return onRemovedFromGroup(ev.channelId, ev.replaced);
  if (ev.kind === "error") {
    return line("err", `${where} membership: ${esc(ev.error?.message || String(ev.error))}`);
  }

  // Who was added or removed is announced by onMembershipChange, on
  // every member's screen alike; only what this device could not do is
  // reported here.
  const r = ev.result;
  const skipped = r.skipped.slice().sort().join(",");
  if (skipped !== (lastSkipped.get(ev.channelId) || "")) {
    lastSkipped.set(ev.channelId, skipped);
    if (r.skipped.length) {
      line("sys", `${where} encryption group: ${r.skipped.length} device(s) could not be ` +
        `added yet, no key packages left (${r.skipped.map(short).join(", ")})`);
    }
  }

  if (ev.channelId === currentChannel && (r.removed.length || r.added.length)) {
    cryptoStatus(`encrypted: ready (epoch ${r.epoch})`);
  }
  if (ev.channelId === voiceChannelId && (r.removed.length || r.added.length)) {
    syncVoiceKey().catch((e) => {
      if (isRemoved(e)) onRemovedFromGroup(voiceChannelId, isReset(e));
      else line("err", `voice key: ${esc(e.message)}`);
    });
  }
}

// ------------------------------------------------ join and leave notices
//
// Every device joining or leaving an encrypted channel is announced to
// everyone in it. That is what keeps automatic membership honest: the
// server decides who may join, so a device it slipped in has to be
// visible (decisions.md, Known tensions). client-core works the changes
// out from the MLS group itself; the names next to them are the server's
// word, which is why the device ID is always shown as well.

// Loading history clears the log, so notices that arrive while a channel
// is opening are held and shown after its history.
let holdNotices = false;
let heldNotices = [];

function noticeLine(text) {
  if (holdNotices) heldNotices.push(text);
  else line("sys", text);
}

function releaseNotices() {
  holdNotices = false;
  const held = heldNotices;
  heldNotices = [];
  for (const text of held) line("sys", text);
}

// The revoked flag is the device's status now, not at the time of the
// change, so it is only shown when the device is leaving: a device caught
// up on after it was revoked did not join as a revoked one.
function describeDevice(d, leaving = false) {
  if (session && d.deviceId === session.status.deviceId) return "this device";
  const owner = d.username ? `${esc(d.username)}'s device` : "an unknown device";
  const label = d.label ? ` "${esc(d.label)}"` : "";
  return `${owner}${label} [${short(d.deviceId)}]${leaving && d.revoked ? " (revoked)" : ""}`;
}

function describeCommitter(change) {
  if (change.self) return "this device";
  if (!change.by) return "a member";
  return change.by.username ? esc(change.by.username) : `device [${short(change.by.deviceId)}]`;
}

function onMembershipChange(change) {
  let where;
  if (change.channelId === currentChannel && currentChannelEncrypted) where = "";
  else if (change.channelId === voiceChannelId) where = "voice: ";
  else return;

  const by = describeCommitter(change);
  for (const d of change.joined) {
    // A device that committed its own join came in from the published
    // group info, with nobody adding it.
    const how = change.by && change.by.deviceId === d.deviceId
      ? "joined on its own from the published group info"
      : `added by ${by}`;
    noticeLine(`${where}${describeDevice(d)} joined the encryption group ` +
      `(${how}, epoch ${change.epoch})`);
  }
  for (const d of change.left) {
    noticeLine(`${where}${describeDevice(d, true)} was removed from the encryption group ` +
      `(by ${by}, epoch ${change.epoch})`);
  }
}

/**
 * This device was taken out of a group, almost always because it lost
 * access. Its state is already gone. In the text channel it waits to be
 * added back (a welcome brings it in on the next group_advanced); in a
 * call it has to leave, because it can no longer derive the media key.
 *
 * replaced: the whole group was replaced instead (decisions.md,
 * "replaced, not rescued"). Access is unchanged, so the text channel
 * rejoins the new group at once; a call still has to be left and joined
 * again, because its media key came from the old group.
 */
function onRemovedFromGroup(channelId, replaced = false) {
  if (channelId === voiceChannelId) {
    line("sys", replaced
      ? "the voice channel's encryption group was replaced; leaving the call (join again)"
      : "this device was removed from the voice channel's encryption group; leaving the call");
    room?.disconnect();
    return;
  }
  if (channelId !== currentChannel) return;
  if (replaced) {
    line("sys", "this channel's encryption group was replaced; rejoining");
    openGroup(channelId)
      .then((ready) => { if (ready) session.groups.reconcileSoon(channelId); })
      .catch((e) => line("err", esc(e.message)));
    return;
  }
  line("sys", "this device was removed from this channel's encryption group");
  cryptoStatus("removed from the encryption group; will rejoin automatically if added back");
}

/**
 * A commit landed in the text channel. A member applies it; a device
 * still waiting checks whether it was the one just added.
 */
async function onGroupAdvanced() {
  const channelId = currentChannel;
  if (!session || !currentChannelEncrypted) return;

  if (!session.groups.isMember(channelId)) {
    const ready = await openGroup(channelId);
    if (ready) line("sys", "this device was added to the channel's encryption group");
    if (ready) session.groups.reconcileSoon(channelId);
    return;
  }

  try {
    const epoch = await session.groups.catchUp(channelId);
    line("sys", `group advanced to epoch ${epoch}`);
    cryptoStatus(`encrypted: ready (epoch ${epoch})`);
    session.groups.reconcileSoon(channelId);
  } catch (e) {
    if (isRemoved(e)) return onRemovedFromGroup(channelId, isReset(e));
    throw e;
  }
}

// ------------------------------------------------------- device identity
//
// Runs once after sign-in. Creates this browser's cryptographic identity
// if it does not have one, then publishes key packages so other people
// can add this device to groups while it is offline.
//
// Private key material never leaves the browser. The server stores only
// the public halves and hands them out one at a time.

async function setUpIdentity() {
  if (typeof OpenVoxaCore === "undefined") return;

  try {
    session = await OpenVoxaCore.startSession(
      call,
      myUserID,
      `${navigator.platform || "browser"} (debug client)`,
    );
    const status = session.status;
    session.groups.onAuto(onAutoReconcile);
    session.groups.onMembership(onMembershipChange);

    $("idStatus").textContent =
      `device ${status.deviceId.slice(0, 8)} - ` +
      `${status.available} key package(s) available` +
      `${status.hasLastResort ? ", last-resort ready" : ""}` +
      `${status.published ? `, published ${status.published}` : ""}`;

    $("idRefresh").disabled = false;
    $("idForget").disabled = false;
  } catch (e) {
    $("idStatus").textContent = `identity setup failed: ${e.message}`;
  }
}

async function forgetDevice() {
  if (!confirm(
    "Forget this device?\n\n" +
    "All local key material is destroyed. Messages in encrypted channels " +
    "that only this device could read become unreadable, permanently."
  )) return;

  // Revoke it on the server first. Wiping only the local keys used to
  // leave the device listed as active, so members kept adding a device
  // nobody holds the keys for, spending its key packages and in the end
  // its reusable last-resort one. 404 means it was already revoked.
  if (session) {
    try {
      await call(`/api/v1/devices/${session.status.deviceId}`, { method: "DELETE" });
    } catch (e) {
      if (e.status !== 404) {
        $("idStatus").textContent =
          `could not revoke this device on the server (${e.message}); nothing was forgotten`;
        return;
      }
    }
  }

  await OpenVoxaCore.forgetIdentity();
  session = null;
  $("idStatus").textContent = "device forgotten; sign in again to create a new one";
  $("idRefresh").disabled = true;
  $("idForget").disabled = true;
}

async function runMlsSelfTest() {
  const out = $("mlsOutput");
  const status = $("mlsStatus");

  if (typeof OpenVoxaCore === "undefined") {
    status.textContent = "client-core did not load";
    return;
  }

  status.textContent = "running...";
  out.textContent = "";

  const result = await OpenVoxaCore.selfTest();

  status.textContent = result.ok
    ? `passed in ${result.elapsedMs}ms (${result.provider})`
    : `FAILED: ${result.error}`;

  out.innerHTML = result.steps.map((s) => `&middot; ${esc(s)}`).join("<br>");
}

// ------------------------------------------------------------ moderation

let myRole = null;

function isModerator() {
  return myRole === "moderator" || myRole === "administrator";
}

// Per-message controls. The client decides what to show; the server
// decides what is allowed. A user who forges a delete request on someone
// else's message gets a 403.
function messageActions(el, m) {
  if (m.deleted) return;

  const mine = m.author_id && m.author_id === myUserID;
  if (!mine && !isModerator()) {
    if (!m.author_id) return;
  }

  const acts = document.createElement("span");
  acts.className = "acts";

  if (mine || isModerator()) {
    const del = document.createElement("button");
    del.textContent = "delete";
    del.title = mine ? "Delete your message" : "Remove as moderator";
    del.onclick = () => removeMessage(m.id);
    acts.appendChild(del);
  }

  if (!mine && m.author_id) {
    const rep = document.createElement("button");
    rep.textContent = "report";
    rep.onclick = () => reportMessage(m);
    acts.appendChild(rep);
  }

  el.appendChild(acts);
}

async function removeMessage(id) {
  try {
    await call(`/api/v1/messages/${id}`, { method: "DELETE" });
  } catch (e) {
    line("err", esc(e.message));
  }
}

async function reportMessage(m) {
  const reason = prompt("Why are you reporting this message?");
  if (reason === null) return;

  try {
    // The body goes along so the server can check the message has not
    // been altered. It compares against its own copy, so an edited
    // report is rejected rather than acted on.
    await call(`/api/v1/messages/${m.id}/report`, {
      method: "POST",
      body: JSON.stringify({ reason, body: m.body })
    });
    line("sys", "report filed");
  } catch (e) {
    line("err", esc(e.message));
  }
}

async function showReports() {
  const list = $("modList");
  list.innerHTML = "loading...";

  let reports;
  try {
    reports = await call("/api/v1/reports");
  } catch (e) {
    list.innerHTML = "";
    return line("err", esc(e.message));
  }

  list.innerHTML = "";
  if (!reports.length) {
    list.textContent = "no open reports";
    return;
  }

  for (const rp of reports) {
    const box = document.createElement("div");
    box.className = "report";

    // Verification status is the first thing a moderator should see, and
    // the system refuses to act on anything unverified.
    const verdict = rp.verified === true
      ? '<span class="ok">signature verified</span>'
      : rp.verified === false
        ? '<span class="bad">DOES NOT MATCH STORED MESSAGE</span>'
        : '<span class="bad">could not be verified</span>';

    box.innerHTML =
      `<div class="meta">${esc(rp.reporter)} reported ${esc(rp.accused)} ` +
      `&middot; ${esc(new Date(rp.created_at).toLocaleString())} &middot; ${verdict}</div>` +
      `<div class="quoted">${esc(rp.claimed_body)}</div>` +
      `<div class="meta">reason: ${esc(rp.reason || "(none given)")}</div>`;

    const row = document.createElement("div");
    row.className = "row";

    if (rp.verified === true) {
      if (rp.message_id) {
        const del = document.createElement("button");
        del.textContent = "Delete message";
        del.onclick = () => removeMessage(rp.message_id).then(() => resolve(rp.id, "action"));
        row.appendChild(del);
      }
      if (rp.accused_id) {
        const ban = document.createElement("button");
        ban.textContent = "Ban author";
        ban.onclick = () => banUser(rp.accused_id).then(() => resolve(rp.id, "action"));
        row.appendChild(ban);
      }
    }

    const dismiss = document.createElement("button");
    dismiss.textContent = "Dismiss";
    dismiss.onclick = () => resolve(rp.id, "dismiss");
    row.appendChild(dismiss);

    box.appendChild(row);
    list.appendChild(box);
  }
}

async function resolve(id, resolution) {
  try {
    await call(`/api/v1/reports/${id}/resolve`, {
      method: "POST",
      body: JSON.stringify({ resolution })
    });
    showReports();
  } catch (e) {
    line("err", esc(e.message));
  }
}

async function banUser(userID) {
  const reason = prompt("Reason for the ban?") ?? "";
  const duration = prompt('Duration, e.g. "7 days". Leave empty for permanent.') ?? "";

  // Asked separately, and only of administrators, because a ban and a
  // purge are different decisions. Banning stops someone participating;
  // purging destroys conversations other people are still reading.
  let purge = false;
  if (myRole === "administrator") {
    purge = confirm(
      "Also permanently destroy every message this account has written?\n\n" +
      "This cannot be undone, and unbanning will not bring them back.\n" +
      "Choose Cancel for a normal ban."
    );
  }

  try {
    const res = await call(`/api/v1/users/${userID}/ban`, {
      method: "POST",
      body: JSON.stringify({ reason, duration, purge_messages: purge })
    });
    line("sys", purge
      ? `user banned; ${res.purged_messages} message(s) destroyed`
      : "user banned");
  } catch (e) {
    line("err", esc(e.message));
  }
}

async function showBans() {
  const list = $("modList");
  list.innerHTML = "loading...";

  let bans;
  try {
    bans = await call("/api/v1/bans");
  } catch (e) {
    list.innerHTML = "";
    return line("err", esc(e.message));
  }

  list.innerHTML = "";
  if (!bans.length) {
    list.textContent = "no active bans";
    return;
  }

  for (const b of bans) {
    const box = document.createElement("div");
    box.className = "report";
    box.innerHTML =
      `<div><strong>${esc(b.username)}</strong> ` +
      `<span class="meta">banned by ${esc(b.actor)} &middot; ` +
      `${b.expires_at ? "until " + esc(new Date(b.expires_at).toLocaleString()) : "permanent"}` +
      `</span></div>` +
      `<div class="meta">reason: ${esc(b.reason || "(none given)")}</div>`;

    const un = document.createElement("button");
    un.textContent = "Unban";
    un.onclick = async () => {
      try {
        await call(`/api/v1/users/${b.user_id}/ban`, { method: "DELETE" });
        showBans();
      } catch (e) {
        line("err", esc(e.message));
      }
    };
    box.appendChild(un);
    list.appendChild(box);
  }
}

// ------------------------------------------------------------------ gifs
//
// Every image here is served by our own server, including the thumbnails
// in the picker. The client never talks to Giphy or Tenor, so browsing
// GIFs does not tell a third party who is reading this channel.
//
// Picking one does not link to the provider either: the server downloads
// it once and stores it as an ordinary attachment, which means it obeys
// the channel's retention policy and disappears when the message does.

let gifEnabled = false;

async function loadGifConfig() {
  try {
    const cfg = await call("/api/v1/gifs/config");
    gifEnabled = cfg.enabled;
    if ($("gif")) $("gif").hidden = !cfg.enabled;
    if ($("gifCredit")) $("gifCredit").textContent = cfg.attribution || "";
  } catch {
    gifEnabled = false;
    if ($("gif")) $("gif").hidden = true;
  }
}

async function searchGifs() {
  const grid = $("gifGrid");
  grid.innerHTML = "searching...";

  const q = encodeURIComponent($("gifQuery").value.trim());

  let data;
  try {
    data = await call(`/api/v1/gifs/search?q=${q}`);
  } catch (e) {
    grid.innerHTML = "";
    return line("err", esc(e.message));
  }

  grid.innerHTML = "";
  $("gifCredit").textContent = data.attribution || "";

  if (!data.results.length) {
    grid.textContent = "no results";

  }

  for (const r of data.results) {
    const img = document.createElement("img");
    img.src = api + r.preview_url;
    img.alt = r.description || "GIF";

async function pickGif(r) {
  $("gifPanel").hidden = true;

  try {
    const info = await call(`/api/v1/channels/${currentChannel}/gifs`, {
      method: "POST",
      body: JSON.stringify({ token: r.token, description: r.description })
    });
    pending.push(info);
    renderPending();
  } catch (e) {
    line("err", esc(e.message));
  }
}

// on() rather than direct assignment: a null element here would throw at
// parse time and silently prevent every handler BELOW it from being
// attached, including the login button. A missing GIF control should cost
// the GIF feature, not the whole page.
function on(id, event, handler) {
  const el = $(id);
  if (el) el[event] = handler;
  else console.warn(`missing element: ${id}`);
}

  OpenVoxaCore.setUpIdentity(call, myUserID, "refresh")

});

// ------------------------------------------------------------- markdown
//
// Hand-rolled rather than pulling in a library. Message bodies are
// untrusted input, so everything is HTML-escaped FIRST and formatting is
// applied to the escaped text afterwards. That ordering is what makes
// this safe: there is no path by which a user's angle bracket becomes a
// tag.
//
// Deliberately small. Bold, italic, strikethrough, inline code, fenced
// code, blockquote and autolinks cover what people actually use in chat.

function markdown(raw) {
  const codeBlocks = [];

  // Fenced code first, stashed behind placeholders so formatting rules
  // below cannot reach inside it.
  let text = raw.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/^\n/, ""));
    return `\u0000${codeBlocks.length - 1}\u0000`;
  });

  text = esc(text);

  const inline = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => {
    inline.push(code);
    return `\u0001${inline.length - 1}\u0001`;
  });

  text = text
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_]+)_/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  // Autolink. The text is already escaped, so &amp; inside a query string
  // is matched and emitted as-is rather than being double-encoded.
  text = text.replace(/(https?:\/\/[^\s<]+)/g, (url) =>
    `<a href="${url}" target="_blank" rel="noopener noreferrer nofollow">${url}</a>`);

  text = text.replace(/^&gt; ?(.*)$/gm, "<blockquote>$1</blockquote>");
  text = text.replace(/\n/g, "<br>");

  text = text.replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${esc(inline[+i])}</code>`);
  text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${esc(codeBlocks[+i])}</code></pre>`);

  return text;
}

// -------------------------------------------------------- link previews

const previewCache = new Map();

function youtubeID(url) {
  const m = url.match(
    /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

async function addPreview(after, url) {
  if (previewCache.has(url)) {
    if (previewCache.get(url)) renderPreview(after, previewCache.get(url), url);
    return;
  }

  let data = null;
  try {
    data = await call("/api/v1/unfurl", {
      method: "POST",
      body: JSON.stringify({ url })
    });
  } catch { /* unreachable, blocked, or not a web page */ }

  previewCache.set(url, data);
  if (data) renderPreview(after, data, url);
}

function renderPreview(after, p, url) {
  const box = document.createElement("div");
  box.className = "preview";

  const parts = [];
  if (p.site) parts.push(`<div class="site">${esc(p.site)}</div>`);
  if (p.title) {
    parts.push(`<div class="title"><a href="${esc(p.url || url)}" ` +
      `target="_blank" rel="noopener noreferrer nofollow">${esc(p.title)}</a></div>`);
  }
  if (p.description) parts.push(`<div class="desc">${esc(p.description)}</div>`);
  box.innerHTML = parts.join("");

  const vid = youtubeID(url);
  if (vid) {
    // Click to load. Embedding the player immediately would contact
    // YouTube for every message containing a link, whether or not anyone
    // watches it. The thumbnail comes from the preview the server already
    // fetched, so nothing is requested until the user asks for it.
    const wrap = document.createElement("div");
    wrap.className = "embed";
    if (p.image) {
      const thumb = document.createElement("img");
      thumb.src = p.image;
      thumb.alt = "";
      wrap.appendChild(thumb);
    }
    const play = document.createElement("div");
    play.className = "play";
    play.textContent = "\u25B6";
    wrap.appendChild(play);

    wrap.onclick = () => {
      const frame = document.createElement("iframe");
      frame.src = `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1`;
      frame.allow = "accelerometer; encrypted-media; picture-in-picture";
      frame.allowFullscreen = true;
      frame.referrerPolicy = "no-referrer";
      wrap.replaceWith(frame);
    };

    box.appendChild(wrap);
  } else if (p.image) {
    const img = document.createElement("img");
    img.src = p.image;
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    box.appendChild(img);
  }

  after.insertAdjacentElement("afterend", box);
  logEl.scrollTop = logEl.scrollHeight;
}

function renderMessage(m) {
  const when = new Date(m.created_at).toLocaleTimeString();

  // A tombstone keeps its place in the conversation so replies around it
  // still make sense. The content is gone, not hidden.
  // Tag every rendered message so events can find it again without a
  // reconnect: by id for a single deletion, by author for an account
  // purge, by timestamp for a retention cutoff.
  const tag = (el) => {
    el.dataset.id = m.id;
    el.dataset.author = m.author_id || "";
    el.dataset.ts = m.created_at;
    return el;
  };

  if (m.deleted) {
    tag(line("msg sys", `<span class="at">${esc(when)}</span> [message removed]`));
    return;
  }

  const el = tag(line("msg",
    `<span class="at">${esc(when)}</span> ` +
    `<span class="who">${esc(m.username || "[deleted user]")}</span>: ${markdown(m.body)}`));

  messageActions(el, m);
  renderAttachments(el, m.attachments, m.files);

  // One preview per message, for the first link only. Several cards under
  // a single message is noise rather than information.
  //
  // Not in encrypted channels: the server fetches the preview, so asking
  // for one would hand it every link in a conversation it cannot read.
  const first = m.body.match(/https?:\/\/[^\s]+/);
  if (first && !currentChannelEncrypted) addPreview(el, first[0]);
}

// ------------------------------------------------- server event handling

function tombstone(el) {
  const when = el.querySelector(".at")?.textContent || "";
  // A preview sits immediately after its message, so it has to go too.
  // Leaving it would keep the deleted content's title and thumbnail on
  // screen, which defeats the point of deleting it.
  // Attachments and previews both sit immediately after their message, so
  // both have to go. Leaving them would keep the deleted content on
  // screen, which defeats the deletion.
  while (el.nextElementSibling?.classList.contains("preview") ||
         el.nextElementSibling?.classList.contains("attachments")) {
    el.nextElementSibling.remove();
  }
  el.className = "msg sys";
  el.innerHTML = `<span class="at">${esc(when)}</span> [message removed]`;
}

function onUserPurged(userID) {
  let n = 0;
  logEl.querySelectorAll(`[data-author="${CSS.escape(userID)}"]`).forEach((el) => {
    forgetPlaintext(el.dataset.id);
    tombstone(el);
    n++;
  });
  if (n) line("sys", `an account was deleted; ${n} message(s) removed`);
}

function onChannelPurged(channelID, before) {
  if (channelID !== currentChannel) return;
  const cutoff = new Date(before).getTime();

  let n = 0;
  logEl.querySelectorAll("[data-ts]").forEach((el) => {
    if (new Date(el.dataset.ts).getTime() < cutoff) {
      forgetPlaintext(el.dataset.id);
      while (el.nextElementSibling?.classList.contains("preview") ||
             el.nextElementSibling?.classList.contains("attachments")) {
        el.nextElementSibling.remove();
      }
      el.remove();
      n++;
    }
  });
  if (n) line("sys", `${n} message(s) passed this channel's retention limit`);
}

function onMessageDeleted(messageID) {
  forgetPlaintext(messageID);
  const el = logEl.querySelector(`[data-id="${CSS.escape(messageID)}"]`);
  if (el) tombstone(el);
}

// Deletion has to reach this device's archive too, or a removed message
// would reappear from local storage on the next history load. Only the
// rendered messages are known here. A tombstone not on screen is caught
// when history next delivers it; a message removed by retention while
// off screen stays in the archive, unreachable but on disk (open item).
function forgetPlaintext(messageID) {
  if (!messageID) return;
  OpenVoxaCore.storage.deletePlaintext(messageID).catch(() => {});
}

async function call(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token) headers["Authorization"] = `Bearer ${token}`;

  const res = await fetch(api + path, { ...options, headers });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;

  if (!res.ok) {
    // Some refusals carry `reason` rather than `error` (an epoch
    // conflict on commit), and statusText is empty over HTTP/2, so fall
    // back to the status code. client-core relies on the status to spot
    // an epoch conflict and rebase.
    const err = new Error(data?.error || data?.reason || `HTTP ${res.status}`);
    err.status = res.status;
    throw err;
  }
  return data;
}

async function authenticate(path) {
  try {
    const data = await call(path, {
      method: "POST",
      body: JSON.stringify({
        username: $("username").value,
        password: $("password").value,
        device_name: "debug-client"
      })
    });
    token = data.token;
    myUserID = data.user_id;
    $("deleteAccount").disabled = false;
    myRole = data.role;
    if ($("modOpen")) {
      $("modOpen").hidden = !isModerator();
      $("modOpen").disabled = !isModerator();
    }
    $("whoami").textContent = `${data.username} (${data.role})`;
    line("sys", `signed in as ${esc(data.username)}, role ${esc(data.role)}`);
    await loadChannels();
    await loadGifConfig();
    await setUpIdentity();
  } catch (err) {
    line("err", `auth failed: ${esc(err.message)}`);
  }
}

async function loadChannels() {
  const channels = await call("/api/v1/channels");

  const voiceSelect = $("voiceChannel");
  voiceSelect.innerHTML = "";
  for (const c of channels.filter((c) => c.kind === "voice")) {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.dataset.forcePtt = c.force_ptt ? "1" : "";
    opt.textContent =
      `${c.name}${c.can_post ? "" : " (listen only)"}${c.force_ptt ? " [PTT required]" : ""}`;
    voiceSelect.appendChild(opt);
  }
  $("joinVoice").disabled = voiceSelect.options.length === 0;

  const select = $("channel");
  const keep = select.value;
  select.innerHTML = "";

  for (const c of channels.filter((c) => c.kind === "text")) {
    const opt = document.createElement("option");
    opt.value = c.id;
    const access = c.can_post ? "can post" : "read only";
    opt.dataset.encrypted = c.encrypted ? "1" : "";
    opt.textContent =
      `${c.name} (${c.encrypted ? "encrypted" : "plaintext"}, kept ${c.retention}, ${access})`;
    select.appendChild(opt);
  }

  if (keep) select.value = keep;
  $("connect").disabled = select.options.length === 0 || !!socket;
}

async function connect() {
  const opt = $("channel").selectedOptions[0];
  const channelID = $("channel").value;
  currentChannel = channelID;
  currentChannelEncrypted = opt?.dataset.encrypted === "1";
  holdNotices = true;
  heldNotices = [];

  if (currentChannelEncrypted) {
    const ready = await openGroup(channelID);
    if (ready) session.groups.reconcileSoon(channelID);
    if (!ready) {
      // Still connect: the channel list and membership changes arrive
      // over the same socket, so a device waiting for an invitation
      // finds out through it.
      line("sys", "connecting read-only until this device is added");
    }
  }

  // Two steps on purpose: browsers cannot set an Authorization header on a
  // websocket, so we trade the session token for a single-use ticket rather
  // than putting the token itself in a URL.
  const { ticket } = await call("/api/v1/ws/ticket", { method: "POST" });

  const url = new URL("/api/v1/ws", api);
  url.protocol = url.protocol.replace("http", "ws");
  url.searchParams.set("ticket", ticket);
  url.searchParams.set("channel", channelID);

  socket = new WebSocket(url);

  socket.onopen = () => {
    $("status").textContent = "connected";
    $("body").placeholder = "Message";
    $("connect").disabled = true;
    $("disconnect").disabled = false;
    $("body").disabled = false;
    $("send").disabled = false;
    $("attach").disabled = false;
    if ($("gif")) $("gif").disabled = !gifEnabled;
  };

  socket.onclose = () => {
    releaseNotices();
    awaitingEcho.length = 0;
    $("status").textContent = "disconnected";
    $("connect").disabled = false;
    $("disconnect").disabled = true;
    $("body").disabled = true;
    $("send").disabled = true;
    $("attach").disabled = true;
    if ($("gif")) $("gif").disabled = true;
    if ($("gifPanel")) $("gifPanel").hidden = true;
    pending = [];
    renderPending();
    line("sys", "connection closed");
  };

  socket.onmessage = (event) => {
    const frame = JSON.parse(event.data);
    if (frame.type === "history") {
      logEl.innerHTML = "";
      line("sys", `${frame.messages.length} earlier message(s)`);
      for (const m of frame.messages) enqueueInbound(m);
      // After the history renders, not before: it goes through the same
      // queue, so held notices land below the messages they followed.
      inbound = inbound.then(releaseNotices);

      // The server decides; this only reflects its answer in the UI.
      if (!frame.can_post) {
        line("sys", "you have read-only access to this channel");
        $("body").disabled = true;
        $("send").disabled = true;
        $("body").placeholder = "Read only";
      }
    } else if (frame.type === "message") {
      enqueueInbound(frame);
    } else if (frame.type === "error") {
      line("err", esc(frame.error));
    } else if (frame.type === "user_purged") {
      onUserPurged(frame.user_id);
      reconcileOpenGroups();
    } else if (frame.type === "access_changed") {
      // A ban, unban, device revoke, or a device publishing key packages.
      reconcileOpenGroups();
    } else if (frame.type === "channel_purged") {
      onChannelPurged(frame.channel_id, frame.before);
    } else if (frame.type === "message_deleted") {
      onMessageDeleted(frame.message_id);
    } else if (frame.type === "channel_changed") {
      // Settings moved. What this client may see depends on its role, so
      // the authoritative answer comes from refetching rather than from
      // anything carried in the event.
      loadChannels().catch(() => {});
    } else if (frame.type === "channel_deleted") {
      if (frame.channel_id === currentChannel) {
        line("sys", "this channel was deleted");
        socket?.close();
      }
      loadChannels().catch(() => {});
    } else if (frame.type === "group_advanced") {
      // Someone changed the membership. Apply their commit now rather
      // than discovering it when the next message fails to decrypt.
      if (frame.channel_id === currentChannel) {
        onGroupAdvanced().catch((e) => line("err", esc(e.message)));
      }
    } else if (frame.type === "role_changed") {
      if (frame.user_id === myUserID) {
        myRole = frame.role;
        if ($("modOpen")) {
          $("modOpen").hidden = !isModerator();
          $("modOpen").disabled = !isModerator();
        }
        $("whoami").textContent =
          `${$("whoami").textContent.split(" (")[0]} (${frame.role})`;
        line("sys", `your role is now ${esc(frame.role)}`);
        loadChannels().catch(() => {});
      }
      // Anyone's role moving can change who belongs in a group.
      reconcileOpenGroups();
    }
  };
}

async function send() {
  const input = $("body");
  if (!socket) return;
  if (!input.value.trim() && !pending.length) return;

  let body = input.value;

  if (currentChannelEncrypted) {
    if (!session || !session.groups.isMember(currentChannel)) {
      return line("err", "this device has not been added to this channel yet");
    }
    const envelope = OpenVoxaCore.encodeEnvelope({
      text: body,
      files: pending.filter((a) => a.fileKey).map((a) => a.fileKey),
    });
    const ciphertext = await session.groups.encrypt(
      currentChannel,
      new TextEncoder().encode(envelope),
    );
    awaitingEcho.push(envelope);
    body = b64encode(ciphertext);
  }

  socket.send(JSON.stringify({
    type: "send",
    body,
    attachments: pending.map((a) => a.id)
  }));

  input.value = "";
  pending = [];
  renderPending();
}

let micTrack = null;
let pttActive = false;

function renderParticipants() {
