<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --fg: CanvasText;
    --line: color-mix(in srgb, CanvasText 25%, Canvas);
    --muted: color-mix(in srgb, CanvasText 55%, Canvas);
  }
  body {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0; padding: 1rem;
    background: var(--bg); color: var(--fg);
    max-width: 60rem;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); margin: 0 0 1rem; padding: .75rem; }
  legend { color: var(--muted); padding: 0 .35rem; }
  label { display: block; margin-bottom: .5rem; }
  input, button, select {
    font: inherit; padding: .35rem .5rem;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
  }
  input { width: 100%; max-width: 24rem; }
  button { cursor: pointer; }
  #log {
    border: 1px solid var(--line); height: 24rem;
    overflow-y: auto; padding: .5rem; margin-bottom: .5rem;
  }
  .msg { margin-bottom: .25rem; word-wrap: break-word; }
  .who { font-weight: 600; }
  .at { color: var(--muted); font-size: .85em; }
  .sys { color: var(--muted); font-style: italic; }
  .err { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .err { color: #ff6b5a; } }
  .attachments { margin: .2rem 0 .4rem 1.5rem; }
  .attachments a { display: inline-block; padding: .2rem .5rem;
    border: 1px solid var(--line); margin-right: .3rem; color: inherit; }
  .attachments img, .attachments video { max-width: 20rem; max-height: 15rem;
    display: block; border: 1px solid var(--line); margin-top: .3rem; }
  #pending { color: var(--muted); font-size: .85em; margin-bottom: .3rem; }

  #gifPanel { border: 1px solid var(--line); padding: .5rem; margin-bottom: .5rem; }
  #gifPanel[hidden] { display: none; }
  #gifGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
    gap: .4rem; max-height: 18rem; overflow-y: auto; margin-top: .5rem; }
  #gifGrid img { width: 100%; height: 7rem; object-fit: cover;
    cursor: pointer; border: 1px solid var(--line); background: #000; }
  #gifGrid img:hover { border-color: CanvasText; }
  #gifCredit { color: var(--muted); font-size: .8em; margin-top: .4rem; }
  #composer { display: flex; gap: .5rem; }
  #composer input { flex: 1; max-width: none; }
  #status { color: var(--muted); margin-left: .5rem; }
  #whoami { color: var(--muted); margin-left: .5rem; font-weight: 400; }
  #participants { list-style: none; margin: .5rem 0 0; padding: 0; }
  #participants li { padding: .15rem 0; }
  .speaking { font-weight: 600; }
  .ptt-hint { color: var(--muted); font-size: .85em; }

  .msg code { background: color-mix(in srgb, CanvasText 12%, Canvas);
    padding: .05rem .25rem; border-radius: 3px; }
  .msg pre { background: color-mix(in srgb, CanvasText 12%, Canvas);
    padding: .4rem .6rem; overflow-x: auto; margin: .25rem 0; }
  .msg pre code { background: none; padding: 0; }
  .msg blockquote { border-left: 3px solid var(--line); margin: .25rem 0;
    padding-left: .5rem; color: var(--muted); }
  .msg a { color: inherit; }

  .preview { border: 1px solid var(--line); border-left-width: 3px;
    margin: .25rem 0 .5rem 1.5rem; padding: .4rem .6rem; max-width: 34rem; }
  .preview .site { color: var(--muted); font-size: .8em; }
  .preview .title { font-weight: 600; }
  .preview .desc { color: var(--muted); font-size: .9em; }
  .preview img { max-width: 100%; margin-top: .4rem; display: block; }
  .preview .embed { position: relative; cursor: pointer; margin-top: .4rem; }
  .preview .embed .play { position: absolute; inset: 0; display: grid;
    place-items: center; font-size: 2rem; color: #fff;
    background: rgba(0,0,0,.35); }
  .preview iframe { width: 100%; aspect-ratio: 16/9; border: 0; margin-top: .4rem; }
  #screens { display: grid; gap: .5rem; margin-top: .5rem; }
  #screens figure { margin: 0; border: 1px solid var(--line); position: relative; }
  #screens video { width: 100%; display: block; background: #000; }
  #screens figcaption { padding: .25rem .5rem; color: var(--muted); font-size: .85em;
    display: flex; justify-content: space-between; gap: .5rem; align-items: center; }
  /* Overlaid rather than in the caption so it stays visible in
     fullscreen, which is exactly when you want to read it. */
  #screens .stats {
    position: absolute; top: .4rem; left: .4rem; z-index: 1;
    font-variant-numeric: tabular-nums; font-size: .8rem;
    background: rgba(0,0,0,.65); color: #fff;
    padding: .15rem .4rem; border-radius: 3px;
    pointer-events: none;
  }
  #screens button { font-size: .85em; padding: .1rem .4rem; }
  #screens video { cursor: zoom-in; }
  #screens figure:fullscreen video { height: 100vh; object-fit: contain; cursor: zoom-out; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .5rem; }
  .row label { margin: 0; }
  .num { width: 6rem; }
  #customBox[hidden] { display: none; }
</style>
</head>
<body>

<h1>OpenVoxa debug client <span id="status">disconnected</span> <span id="whoami"></span></h1>

<fieldset>

  <label>password <input id="password" type="password" autocomplete="current-password"></label>
  <button id="login">Log in</button>
  <button id="register">Register</button>
  <button id="deleteAccount" disabled>Delete account</button>
</fieldset>

<fieldset>
  <legend>channel</legend>
  <select id="channel"></select>
  <button id="connect" disabled>Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
</fieldset>

<fieldset>

  <label style="margin-top:.5rem">

    <span class="ptt-hint">(hold Space while this page has focus)</span>
  </label>

</fieldset>

<fieldset>
  <legend>screen share</legend>

  <div class="row">

      <option value="1280x720x30x2500">720p 30fps</option>
      <option value="1920x1080x30x4000" selected>1080p 30fps</option>
      <option value="1920x1080x60x8000">1080p 60fps</option>

    </select>

      <option value="maintain-resolution">Prioritise detail</option>
      <option value="maintain-framerate">Prioritise motion</option>
    </select>

    <select id="codec" title="H.264 is hardware-decoded almost everywhere, including Safari">
      <option value="h264" selected>H.264</option>
      <option value="vp8">VP8</option>
      <option value="vp9">VP9</option>
      <option value="av1">AV1</option>
    </select>

    <label><input type="checkbox" id="simulcast"> simulcast</label>

  <div class="row" id="customBox" hidden>
    <label>w <input class="num" type="number" id="cw" value="1920" min="160" max="7680"></label>
    <label>h <input class="num" type="number" id="ch" value="1080" min="120" max="4320"></label>
    <label>fps <input class="num" type="number" id="cf" value="60" min="1" max="240"></label>
    <label>kbps <input class="num" type="number" id="cb" value="8000" min="100" max="100000"></label>
  </div>

  <div class="row">
    <button id="startShare" disabled>Share screen</button>

  <div id="screens"></div>
</fieldset>

<div id="log" aria-live="polite"></div>

<div id="gifPanel" hidden>
  <div class="row">
    <input id="gifQuery" placeholder="Search GIFs" autocomplete="off" style="flex:1">
    <button id="gifSearch">Search</button>
    <button id="gifClose">Close</button>
  </div>
  <div id="gifGrid"></div>
  <div id="gifCredit"></div>
</div>

<div id="pending"></div>

<div id="composer">
  <input id="body" placeholder="Message" disabled autocomplete="off">
  <input type="file" id="file" multiple hidden>
  <button id="attach" disabled>Attach</button>
  <button id="send" disabled>Send</button>
</div>

<script>
const api = location.origin;
let token = null;
let socket = null;
let currentChannel = null;
let myUserID = null;

const $ = (id) => document.getElementById(id);
const logEl = $("log");

function line(cls, html) {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = html;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  return div;
}

// Everything from the server is treated as untrusted text. Message bodies
// are other people's input and must never be injected as HTML.
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

// ----------------------------------------------------------- attachments

let pending = [];

function renderPending() {
  $("pending").textContent = pending.length
    ? "attached: " + pending.map((a) => `${a.filename} (${fmtSize(a.size)})`).join(", ")
    : "";
}

function fmtSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

async function upload(files) {
  for (const file of files) {
    const form = new FormData();
    form.append("file", file);

    // Deliberately not using call(): FormData must set its own
    // Content-Type, including the multipart boundary.
    const res = await fetch(`${api}/api/v1/channels/${currentChannel}/attachments`, {
      method: "POST",
      headers: { Authorization: `Bearer ${token}` },
      body: form
    });

    if (!res.ok) {
      const data = await res.json().catch(() => null);
      line("err", esc(data?.error || `upload failed: ${file.name}`));
      continue;
    }

    pending.push(await res.json());
    renderPending();
  }
}

function renderAttachments(after, list) {
  if (!list || !list.length) return;

  const box = document.createElement("div");
  box.className = "attachments";

  for (const at of list) {
    // Signed by the server and already time-limited, so it works in an
    // <img src> where an Authorization header cannot be sent.
    const url = api + at.url;

    const link = document.createElement("a");
    link.href = url;
    link.textContent = `${at.filename} (${fmtSize(at.size)})`;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    box.appendChild(link);

    // Only preview types the server is willing to serve inline. Anything
    // else stays a download link, which is what stops an uploaded HTML
    // file from executing against our own origin.
    if (/^image\//.test(at.content_type) && at.content_type !== "image/svg+xml") {
      const img = document.createElement("img");
      img.src = url;
      img.alt = at.filename;
      box.appendChild(img);
    } else if (/^video\//.test(at.content_type)) {
      const vid = document.createElement("video");
      vid.src = url;
      vid.controls = true;
      box.appendChild(vid);
    } else if (/^audio\//.test(at.content_type)) {
      const aud = document.createElement("audio");
      aud.src = url;
      aud.controls = true;
      box.appendChild(aud);
    }
  }

  after.insertAdjacentElement("afterend", box);
  logEl.scrollTop = logEl.scrollHeight;
}

// ------------------------------------------------------------------ gifs
//
// Every image here is served by our own server, including the thumbnails
// in the picker. The client never talks to Giphy or Tenor, so browsing
// GIFs does not tell a third party who is reading this channel.
//
// Picking one does not link to the provider either: the server downloads
// it once and stores it as an ordinary attachment, which means it obeys
// the channel's retention policy and disappears when the message does.

let gifEnabled = false;

async function loadGifConfig() {
  try {
    const cfg = await call("/api/v1/gifs/config");
    gifEnabled = cfg.enabled;
    $("gif").hidden = !cfg.enabled;
    $("gifCredit").textContent = cfg.attribution || "";
  } catch {
    gifEnabled = false;
    $("gif").hidden = true;
  }
}

async function searchGifs() {
  const grid = $("gifGrid");
  grid.innerHTML = "searching...";

  const q = encodeURIComponent($("gifQuery").value.trim());

  let data;
  try {
    data = await call(`/api/v1/gifs/search?q=${q}`);
  } catch (e) {
    grid.innerHTML = "";
    return line("err", esc(e.message));
  }

  grid.innerHTML = "";
  $("gifCredit").textContent = data.attribution || "";

  if (!data.results.length) {
    grid.textContent = "no results";
    return;
  }

  for (const r of data.results) {
    const img = document.createElement("img");
    img.src = api + r.preview_url;
    img.alt = r.description || "GIF";
    img.loading = "lazy";
    img.title = r.description || "";
    img.onclick = () => pickGif(r);
    grid.appendChild(img);
  }
}

async function pickGif(r) {
  $("gifPanel").hidden = true;

  try {
    const info = await call(`/api/v1/channels/${currentChannel}/gifs`, {
      method: "POST",
      body: JSON.stringify({ token: r.token, description: r.description })
    });
    pending.push(info);
    renderPending();
  } catch (e) {
    line("err", esc(e.message));
  }
}

$("gif").onclick = () => {
  const panel = $("gifPanel");
  panel.hidden = !panel.hidden;
  if (!panel.hidden) {
    $("gifQuery").focus();
    if (!$("gifGrid").children.length) searchGifs();
  }
};
$("gifClose").onclick = () => { $("gifPanel").hidden = true; };
$("gifSearch").onclick = () => searchGifs();
$("gifQuery").onkeydown = (e) => { if (e.key === "Enter") searchGifs(); };

// ------------------------------------------------------------- markdown
//
// Hand-rolled rather than pulling in a library. Message bodies are
// untrusted input, so everything is HTML-escaped FIRST and formatting is
// applied to the escaped text afterwards. That ordering is what makes
// this safe: there is no path by which a user's angle bracket becomes a
// tag.
//
// Deliberately small. Bold, italic, strikethrough, inline code, fenced
// code, blockquote and autolinks cover what people actually use in chat.

function markdown(raw) {
  const codeBlocks = [];

  // Fenced code first, stashed behind placeholders so formatting rules
  // below cannot reach inside it.
  let text = raw.replace(/```([\s\S]*?)```/g, (_, code) => {
    codeBlocks.push(code.replace(/^\n/, ""));
    return `\u0000${codeBlocks.length - 1}\u0000`;
  });

  text = esc(text);

  const inline = [];
  text = text.replace(/`([^`]+)`/g, (_, code) => {
    inline.push(code);
    return `\u0001${inline.length - 1}\u0001`;
  });

  text = text
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*]+)\*/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_]+)_/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>");

  // Autolink. The text is already escaped, so &amp; inside a query string
  // is matched and emitted as-is rather than being double-encoded.
  text = text.replace(/(https?:\/\/[^\s<]+)/g, (url) =>
    `<a href="${url}" target="_blank" rel="noopener noreferrer nofollow">${url}</a>`);

  text = text.replace(/^&gt; ?(.*)$/gm, "<blockquote>$1</blockquote>");
  text = text.replace(/\n/g, "<br>");

  text = text.replace(/\u0001(\d+)\u0001/g, (_, i) => `<code>${esc(inline[+i])}</code>`);
  text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre><code>${esc(codeBlocks[+i])}</code></pre>`);

  return text;
}

// -------------------------------------------------------- link previews

const previewCache = new Map();

function youtubeID(url) {
  const m = url.match(
    /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

async function addPreview(after, url) {
  if (previewCache.has(url)) {
    if (previewCache.get(url)) renderPreview(after, previewCache.get(url), url);
    return;
  }

  let data = null;
  try {
    data = await call("/api/v1/unfurl", {
      method: "POST",
      body: JSON.stringify({ url })
    });
  } catch { /* unreachable, blocked, or not a web page */ }

  previewCache.set(url, data);
  if (data) renderPreview(after, data, url);
}

function renderPreview(after, p, url) {
  const box = document.createElement("div");
  box.className = "preview";

  const parts = [];
  if (p.site) parts.push(`<div class="site">${esc(p.site)}</div>`);
  if (p.title) {
    parts.push(`<div class="title"><a href="${esc(p.url || url)}" ` +
      `target="_blank" rel="noopener noreferrer nofollow">${esc(p.title)}</a></div>`);
  }
  if (p.description) parts.push(`<div class="desc">${esc(p.description)}</div>`);
  box.innerHTML = parts.join("");

  const vid = youtubeID(url);
  if (vid) {
    // Click to load. Embedding the player immediately would contact
    // YouTube for every message containing a link, whether or not anyone
    // watches it. The thumbnail comes from the preview the server already
    // fetched, so nothing is requested until the user asks for it.
    const wrap = document.createElement("div");
    wrap.className = "embed";
    if (p.image) {
      const thumb = document.createElement("img");
      thumb.src = p.image;
      thumb.alt = "";
      wrap.appendChild(thumb);
    }
    const play = document.createElement("div");
    play.className = "play";
    play.textContent = "\u25B6";
    wrap.appendChild(play);

    wrap.onclick = () => {
      const frame = document.createElement("iframe");
      frame.src = `https://www.youtube-nocookie.com/embed/${vid}?autoplay=1`;
      frame.allow = "accelerometer; encrypted-media; picture-in-picture";
      frame.allowFullscreen = true;
      frame.referrerPolicy = "no-referrer";
      wrap.replaceWith(frame);
    };

    box.appendChild(wrap);
  } else if (p.image) {
    const img = document.createElement("img");
    img.src = p.image;
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    box.appendChild(img);
  }

  after.insertAdjacentElement("afterend", box);
  logEl.scrollTop = logEl.scrollHeight;
}

function renderMessage(m) {
  const when = new Date(m.created_at).toLocaleTimeString();

  // A tombstone keeps its place in the conversation so replies around it
  // still make sense. The content is gone, not hidden.
  // Tag every rendered message so events can find it again without a
  // reconnect: by id for a single deletion, by author for an account
  // purge, by timestamp for a retention cutoff.
  const tag = (el) => {
    el.dataset.id = m.id;
    el.dataset.author = m.author_id || "";
    el.dataset.ts = m.created_at;
    return el;
  };

  if (m.deleted) {
    tag(line("msg sys", `<span class="at">${esc(when)}</span> [message removed]`));
    return;
  }

  const el = tag(line("msg",
    `<span class="at">${esc(when)}</span> ` +
    `<span class="who">${esc(m.username || "[deleted user]")}</span>: ${markdown(m.body)}`));

  renderAttachments(el, m.attachments);

  // One preview per message, for the first link only. Several cards under
  // a single message is noise rather than information.
  const first = m.body.match(/https?:\/\/[^\s]+/);
  if (first) addPreview(el, first[0]);
}

// ------------------------------------------------- server event handling

function tombstone(el) {
  const when = el.querySelector(".at")?.textContent || "";
  // A preview sits immediately after its message, so it has to go too.
  // Leaving it would keep the deleted content's title and thumbnail on
  // screen, which defeats the point of deleting it.
  // Attachments and previews both sit immediately after their message, so
  // both have to go. Leaving them would keep the deleted content on
  // screen, which defeats the deletion.
  while (el.nextElementSibling?.classList.contains("preview") ||
         el.nextElementSibling?.classList.contains("attachments")) {
    el.nextElementSibling.remove();
  }
  el.className = "msg sys";
  el.innerHTML = `<span class="at">${esc(when)}</span> [message removed]`;
}

function onUserPurged(userID) {
  let n = 0;
  logEl.querySelectorAll(`[data-author="${CSS.escape(userID)}"]`).forEach((el) => {
    tombstone(el);
    n++;
  });
  if (n) line("sys", `an account was deleted; ${n} message(s) removed`);
}

function onChannelPurged(channelID, before) {
  if (channelID !== currentChannel) return;
  const cutoff = new Date(before).getTime();

  let n = 0;
  logEl.querySelectorAll("[data-ts]").forEach((el) => {
    if (new Date(el.dataset.ts).getTime() < cutoff) {
      while (el.nextElementSibling?.classList.contains("preview") ||
             el.nextElementSibling?.classList.contains("attachments")) {
        el.nextElementSibling.remove();
      }
      el.remove();
      n++;
    }
  });
  if (n) line("sys", `${n} message(s) passed this channel's retention limit`);
}

function onMessageDeleted(messageID) {
  const el = logEl.querySelector(`[data-id="${CSS.escape(messageID)}"]`);
  if (el) tombstone(el);
}

async function call(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token) headers["Authorization"] = `Bearer ${token}`;

  const res = await fetch(api + path, { ...options, headers });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;

  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}

async function authenticate(path) {
  try {
    const data = await call(path, {
      method: "POST",
      body: JSON.stringify({
        username: $("username").value,
        password: $("password").value,
        device_name: "debug-client"
      })
    });
    token = data.token;
    myUserID = data.user_id;
    $("deleteAccount").disabled = false;
    $("whoami").textContent = `${data.username} (${data.role})`;
    line("sys", `signed in as ${esc(data.username)}, role ${esc(data.role)}`);
    await loadChannels();
    await loadGifConfig();
  } catch (err) {
    line("err", `auth failed: ${esc(err.message)}`);
  }
}

async function loadChannels() {
  const channels = await call("/api/v1/channels");

  const voiceSelect = $("voiceChannel");
  voiceSelect.innerHTML = "";
  for (const c of channels.filter((c) => c.kind === "voice")) {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.dataset.forcePtt = c.force_ptt ? "1" : "";
    opt.textContent =
      `${c.name}${c.can_post ? "" : " (listen only)"}${c.force_ptt ? " [PTT required]" : ""}`;
    voiceSelect.appendChild(opt);
  }
  $("joinVoice").disabled = voiceSelect.options.length === 0;

  const select = $("channel");
  const keep = select.value;
  select.innerHTML = "";

  for (const c of channels.filter((c) => c.kind === "text")) {
    const opt = document.createElement("option");
    opt.value = c.id;
    const access = c.can_post ? "can post" : "read only";
    opt.textContent =
      `${c.name} (${c.encrypted ? "encrypted" : "plaintext"}, kept ${c.retention}, ${access})`;
    select.appendChild(opt);
  }

  if (keep) select.value = keep;
  $("connect").disabled = select.options.length === 0 || !!socket;
}

async function connect() {
  const channelID = $("channel").value;
  currentChannel = channelID;

  // Two steps on purpose: browsers cannot set an Authorization header on a
  // websocket, so we trade the session token for a single-use ticket rather
  // than putting the token itself in a URL.
  const { ticket } = await call("/api/v1/ws/ticket", { method: "POST" });

  const url = new URL("/api/v1/ws", api);
  url.protocol = url.protocol.replace("http", "ws");
  url.searchParams.set("ticket", ticket);
  url.searchParams.set("channel", channelID);

  socket = new WebSocket(url);

  socket.onopen = () => {
    $("status").textContent = "connected";
    $("body").placeholder = "Message";
    $("connect").disabled = true;
    $("disconnect").disabled = false;
    $("body").disabled = false;
    $("send").disabled = false;
    $("attach").disabled = false;
    $("gif").disabled = !gifEnabled;
  };

  socket.onclose = () => {
    $("status").textContent = "disconnected";
    $("connect").disabled = false;
    $("disconnect").disabled = true;
    $("body").disabled = true;
    $("send").disabled = true;
    $("attach").disabled = true;
    $("gif").disabled = true;
    $("gifPanel").hidden = true;
    pending = [];
    renderPending();
    line("sys", "connection closed");
  };

  socket.onmessage = (event) => {
    const frame = JSON.parse(event.data);
    if (frame.type === "history") {
      logEl.innerHTML = "";
      line("sys", `${frame.messages.length} earlier message(s)`);
      frame.messages.forEach(renderMessage);

      // The server decides; this only reflects its answer in the UI.
      if (!frame.can_post) {
        line("sys", "you have read-only access to this channel");
        $("body").disabled = true;
        $("send").disabled = true;
        $("body").placeholder = "Read only";
      }
    } else if (frame.type === "message") {
      renderMessage(frame);
    } else if (frame.type === "error") {
      line("err", esc(frame.error));
    } else if (frame.type === "user_purged") {
      onUserPurged(frame.user_id);
    } else if (frame.type === "channel_purged") {
      onChannelPurged(frame.channel_id, frame.before);
    } else if (frame.type === "message_deleted") {
      onMessageDeleted(frame.message_id);
    } else if (frame.type === "channel_changed") {
      // Settings moved. What this client may see depends on its role, so
      // the authoritative answer comes from refetching rather than from
      // anything carried in the event.
      loadChannels().catch(() => {});
    } else if (frame.type === "channel_deleted") {
      if (frame.channel_id === currentChannel) {
        line("sys", "this channel was deleted");
        socket?.close();
      }
      loadChannels().catch(() => {});
    } else if (frame.type === "role_changed") {
      if (frame.user_id === myUserID) {
        $("whoami").textContent =
          `${$("whoami").textContent.split(" (")[0]} (${frame.role})`;
        line("sys", `your role is now ${esc(frame.role)}`);
        loadChannels().catch(() => {});
      }
    }
  };
}

function send() {
  const input = $("body");
  if (!socket) return;
  if (!input.value.trim() && !pending.length) return;

  socket.send(JSON.stringify({
    type: "send",
    body: input.value,
    attachments: pending.map((a) => a.id)
  }));

  input.value = "";
  pending = [];
  renderPending();
}

// ---------------------------------------------------------------- voice

let room = null;
let micTrack = null;
let pttActive = false;

function renderParticipants() {
  const ul = $("participants");
  ul.innerHTML = "";
  if (!room) return;

  const all = [room.localParticipant, ...room.remoteParticipants.values()];
  for (const p of all) {
    const li = document.createElement("li");
    const muted = ![...p.audioTrackPublications.values()].some(
      (pub) => pub.track && !pub.isMuted);
    li.textContent =
      `${p.name || p.identity}${p === room.localParticipant ? " (you)" : ""}` +
      `${muted ? " - muted" : ""}`;
    if (p.isSpeaking) li.className = "speaking";
    ul.appendChild(li);
  }
}

// ------------------------------------------------------- screen sharing

let screenTracks = [];

// Remote video elements, keyed by track SID so they can be removed cleanly.
const screenEls = new Map();

function shareSettings() {
  if ($("preset").value === "custom") {
    return {
      width: +$("cw").value,
      height: +$("ch").value,
      fps: +$("cf").value,
      kbps: +$("cb").value
    };
  }
  const [width, height, fps, kbps] = $("preset").value.split("x").map(Number);
  return { width, height, fps, kbps };
}

$("preset").onchange = () => {
  const custom = $("preset").value === "custom";
  $("customBox").hidden = !custom;

  // Seed the custom fields from whatever preset was last selected, so
  // "custom" starts from something sensible rather than blank.
  if (custom) return;
  const s = shareSettings();
  $("cw").value = s.width; $("ch").value = s.height;
  $("cf").value = s.fps;   $("cb").value = s.kbps;
};

async function startShare() {
  if (!room) return;
  const s = shareSettings();

  // createLocalScreenTracks triggers the browser's own picker. We cannot
  // skip it or preselect a window: the user choosing what to share is a
  // browser security guarantee, not something the page controls.
  screenTracks = await LivekitClient.createLocalScreenTracks({
    audio: $("shareAudio").checked,
    resolution: { width: s.width, height: s.height, frameRate: s.fps }
  });

  // The single most important line for frame rate.
  //
  // Browsers tag display-capture tracks with contentHint "detail" by
  // default, which tells the encoder to hold resolution and sacrifice
  // frame rate. That is right for a spreadsheet and badly wrong for a
  // game: it pins you around 15fps whatever bitrate you ask for.
  // "motion" flips the tradeoff.
  const hint = $("priority").value === "maintain-framerate" ? "motion" : "detail";

  for (const track of screenTracks) {
    if (track.kind === "video") {
      track.mediaStreamTrack.contentHint = hint;
    }

    await room.localParticipant.publishTrack(track, {
      // Screen-share tracks read screenShareEncoding, NOT videoEncoding.
      // Setting only the latter silently leaves LiveKit's default in
      // place, which is 1080p at 15fps and about 1.5 Mbps - and produces
      // a stream that ignores every setting you thought you changed.
      screenShareEncoding: { maxBitrate: s.kbps * 1000, maxFramerate: s.fps },

      // Set as well, so the same code path still behaves if a track ever
      // arrives without the screen-share source tag.
      videoEncoding: { maxBitrate: s.kbps * 1000, maxFramerate: s.fps },

      // Off sends one high quality layer, which is best when every viewer
      // can handle it. On sends several, letting a weaker device drop to a
      // lower one instead of stuttering. Turn it on for mixed audiences.
      simulcast: $("simulcast").checked,

      // Screen share also has its own simulcast layer list. Two layers is
      // enough: full quality, and a half-resolution fallback for anything
      // that cannot keep up.
      screenShareSimulcastLayers: [
        {
          width: Math.round(s.width / 2),
          height: Math.round(s.height / 2),
          encoding: {
            maxBitrate: Math.round(s.kbps * 1000 * 0.3),
            maxFramerate: Math.min(s.fps, 30)
          }
        }
      ],

      // H.264 is hardware-decoded on effectively every device, including
      // iOS. VP8 is software-decoded in Safari, which is why an iPad
      // stutters on high frame rates with the other codecs.
      videoCodec: $("codec").value,

      // Detail keeps text readable and drops frames; motion keeps the
      // frame rate and softens the picture. Right answer depends on
      // whether you are sharing a document or a game.
      degradationPreference: $("priority").value
    });

    // Fires when the user hits the browser's own "Stop sharing" bar, which
    // bypasses our button entirely.
    track.mediaStreamTrack.addEventListener("ended", () => stopShare());
  }

  $("startShare").disabled = true;
  $("stopShare").disabled = false;

  const video = screenTracks.find((t) => t.kind === "video");
  if (video) {
    // What the browser actually granted, which is often not what we asked
    // for. If capture frame rate is already low here, nothing downstream
    // can recover it.
    const got = video.mediaStreamTrack.getSettings();
    line("sys",
      `capture: ${got.width}x${got.height} @ ${Math.round(got.frameRate || 0)}fps, hint "${hint}"`);
    startLocalStats(video);
  }
}

// Publisher-side stats. Distinguishes "the browser is only capturing
// 15 frames a second" from "the encoder is dropping them" from "the
// network cannot carry them" - three problems that look identical from
// the receiving end.
let localStatsTimer = null;

function startLocalStats(track) {
  let lastBytes = 0;
  let lastFrames = 0;
  let lastAt = performance.now();

  clearInterval(localStatsTimer);
  localStatsTimer = setInterval(async () => {
    if (!screenTracks.includes(track)) return clearInterval(localStatsTimer);

    const got = track.mediaStreamTrack.getSettings();
    const now = performance.now();
    const seconds = (now - lastAt) / 1000;

    let sentFps = null;
    let kbps = null;
    let layers = 0;
    try {
      const report = await track.getRTCStatsReport?.();

      // Simulcast produces one outbound-rtp per layer. Totals have to be
      // summed across all of them before differencing, or the numbers come
      // out as nonsense - including negative bitrates.
      let bytes = 0;
      let frames = 0;
      report?.forEach((r) => {
        if (r.type === "outbound-rtp" && r.kind === "video") {
          bytes += r.bytesSent || 0;
          frames = Math.max(frames, r.framesSent || 0);
          layers++;
        }
      });

      if (lastBytes) kbps = Math.round((bytes - lastBytes) * 8 / seconds / 1000);
      if (lastFrames) sentFps = Math.round((frames - lastFrames) / seconds);
      lastBytes = bytes;
      lastFrames = frames;
    } catch { /* stats unavailable */ }

    lastAt = now;

    $("shareStatus").textContent =
      `capture ${got.width}x${got.height}@${Math.round(got.frameRate || 0)} | ` +
      `sending ${sentFps ?? "?"}fps ${kbps ?? "?"}kbps` +
      (layers > 1 ? ` (${layers} layers)` : "");
  }, 1000);
}

async function stopShare() {
  clearInterval(localStatsTimer);
  for (const track of screenTracks) {
    try {
      await room?.localParticipant.unpublishTrack(track, true);
    } catch { /* already gone */ }
    track.stop();
  }
  screenTracks = [];

  $("startShare").disabled = !room;
  $("stopShare").disabled = true;
  $("shareStatus").textContent = "";
}

function addScreen(track, participant) {
  const fig = document.createElement("figure");

  const el = track.attach();
  el.autoplay = true;
  el.playsInline = true;
  // Our own share would echo back as a feedback loop; muting the element
  // does not affect what remote participants hear.
  el.muted = true;

  const stats = document.createElement("div");
  stats.className = "stats";
  stats.textContent = "measuring...";

  const cap = document.createElement("figcaption");

  const who = document.createElement("span");
  who.textContent = `${participant.name || participant.identity} - screen`;

  const full = document.createElement("button");
  full.textContent = "Fullscreen";
  full.onclick = () => toggleFullscreen(fig);
  el.onclick = () => toggleFullscreen(fig);

  cap.append(who, full);
  fig.append(el, stats, cap);
  $("screens").appendChild(fig);
  screenEls.set(track.sid, fig);

  startStats(el, stats, track);
}

function toggleFullscreen(fig) {
  if (document.fullscreenElement === fig) {
    document.exitFullscreen();
  } else {
    fig.requestFullscreen?.().catch(() => {
      // iOS Safari does not allow fullscreen on arbitrary elements, only
      // on the video itself.
      fig.querySelector("video")?.webkitEnterFullscreen?.();
    });
  }
}

// Samples what the browser is actually decoding, once a second.
//
// This is the readout that answers "is it the network or my device".
// Dropped frames climbing means the decoder cannot keep up locally.
// A received frame rate well below what was sent, with no drops, means
// the frames never arrived.
function startStats(el, out, track) {
  let lastFrames = 0;
  let lastBytes = 0;
  let lastAt = performance.now();

  const timer = setInterval(async () => {
    if (!el.isConnected) return clearInterval(timer);

    const q = el.getVideoPlaybackQuality?.();
    const now = performance.now();
    const seconds = (now - lastAt) / 1000;

    let fps = 0;
    let dropped = 0;
    if (q) {
      fps = Math.round((q.totalVideoFrames - lastFrames) / seconds);
      lastFrames = q.totalVideoFrames;
      dropped = q.droppedVideoFrames;
    }

    let kbps = null;
    try {
      const report = await track.getRTCStatsReport?.();
      report?.forEach((s) => {
        if (s.type === "inbound-rtp" && s.kind === "video") {
          if (lastBytes) kbps = Math.round((s.bytesReceived - lastBytes) * 8 / seconds / 1000);
          lastBytes = s.bytesReceived;
        }
      });
    } catch { /* stats unavailable on some browsers */ }

    lastAt = now;

    out.textContent =
      `${el.videoWidth}x${el.videoHeight} ` +
      `${fps}fps` +
      (kbps !== null ? ` ${kbps}kbps` : "") +
      (dropped ? ` ${dropped} dropped` : "");
  }, 1000);
}

function removeScreen(track) {
  track.detach().forEach((el) => el.remove());
  screenEls.get(track.sid)?.remove();
  screenEls.delete(track.sid);
}

$("startShare").onclick = () => startShare().catch((e) => {
  // Cancelling the picker throws NotAllowedError. Not an error worth
  // shouting about.
  if (e.name !== "NotAllowedError") line("err", esc(e.message));
});
$("stopShare").onclick = () => stopShare();

// ------------------------------------------------------------------ voice

async function joinVoice() {
  const opt = $("voiceChannel").selectedOptions[0];
  const data = await call(`/api/v1/channels/${opt.value}/voice-token`, { method: "POST" });

  // adaptiveStream picks a simulcast layer from how large the video
  // element is on screen, so shrinking the window downgrades the stream.
  // Sensible for saving bandwidth, wrong when you want a fixed quality.
  // It is a Room-level setting, so the checkbox only takes effect here,
  // at join time.
  const pinned = $("pinQuality").checked;
  room = new LivekitClient.Room({ adaptiveStream: !pinned, dynacast: true });

  room
    .on(LivekitClient.RoomEvent.ParticipantConnected, renderParticipants)
    .on(LivekitClient.RoomEvent.ParticipantDisconnected, renderParticipants)
    .on(LivekitClient.RoomEvent.ActiveSpeakersChanged, renderParticipants)
    .on(LivekitClient.RoomEvent.TrackMuted, renderParticipants)
    .on(LivekitClient.RoomEvent.TrackUnmuted, renderParticipants)
    .on(LivekitClient.RoomEvent.Disconnected, () => {
      line("sys", "left voice");
      stopShare();
      room = null; micTrack = null;
      screenEls.forEach((fig) => fig.remove());
      screenEls.clear();
      renderParticipants();
      $("joinVoice").disabled = false;
      $("leaveVoice").disabled = true;
      $("muteToggle").disabled = true;
      $("startShare").disabled = true;
    })
    .on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      if (track.kind === "audio") {
        // Remote audio needs an element in the DOM to actually play.
        document.body.appendChild(track.attach());
      } else if (track.source === LivekitClient.Track.Source.ScreenShare) {
        // With adaptiveStream off, nothing chooses a layer for us, so ask
        // for the highest explicitly. Ignored while adaptiveStream is on.
        if (pinned) {
          try {
            pub.setVideoQuality(LivekitClient.VideoQuality.HIGH);
          } catch { /* not a simulcast track */ }
        }
        addScreen(track, participant);
      }
    })
    .on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
      if (track.source === LivekitClient.Track.Source.ScreenShare) {
        removeScreen(track);
      } else {
        track.detach().forEach((el) => el.remove());
      }
    });

  await room.connect(data.url, data.token);
  line("sys", `joined voice: ${esc(opt.textContent)}`);

  if ($("pinQuality").checked) {
    line("sys", "quality pinned: stream stays at full resolution regardless of window size");
  }

  if (data.force_ptt) {
    $("pttMode").checked = true;
    $("pttMode").disabled = true;
    line("sys", "this channel requires push-to-talk");
  } else {
    $("pttMode").disabled = false;
  }

  // Screen sharing rides on the same publish permission as the microphone.
  // Someone who may not speak may not stream either.
  $("startShare").disabled = !data.can_publish;

  if (data.can_publish) {
    micTrack = await LivekitClient.createLocalAudioTrack({
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    });
    await room.localParticipant.publishTrack(micTrack);
    // In PTT mode the mic starts closed and opens only while held.
    if ($("pttMode").checked) await micTrack.mute();
    $("muteToggle").disabled = false;
  } else {
    line("sys", "listen-only: you lack permission to speak here");
  }

  $("joinVoice").disabled = true;
  $("leaveVoice").disabled = false;
  renderParticipants();
}

async function setMuted(muted) {
  if (!micTrack) return;
  muted ? await micTrack.mute() : await micTrack.unmute();
  $("muteToggle").textContent = muted ? "Unmute" : "Mute";
  renderParticipants();
}

$("joinVoice").onclick = () => joinVoice().catch((e) => line("err", esc(e.message)));
$("leaveVoice").onclick = () => room?.disconnect();
$("muteToggle").onclick = () => setMuted(!micTrack?.isMuted);

$("pttMode").onchange = () => setMuted($("pttMode").checked);

// Push-to-talk. A real client puts this behind a global hotkey in Electron
// so it works when the window is not focused; a web page cannot do that.
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || !$("pttMode").checked || pttActive) return;
  if (e.target.tagName === "INPUT") return;
  e.preventDefault();
  pttActive = true;
  setMuted(false);
});

document.addEventListener("keyup", (e) => {
  if (e.code !== "Space" || !pttActive) return;
  pttActive = false;
  setMuted(true);
});

async function deleteAccount() {
  const password = $("password").value;
  if (!password) return line("err", "enter your password to confirm");

  if (!confirm(
    "Delete your account permanently?\n\n" +
    "Every message you have written will be destroyed. There is no undo " +
    "and no recovery."
  )) return;

  const res = await fetch(api + "/api/v1/me", {
    method: "DELETE",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: JSON.stringify({ password })
  });

  if (!res.ok) {
    const data = await res.json().catch(() => null);
    return line("err", esc(data?.error || res.statusText));
  }

  token = null;
  room?.disconnect();
  socket?.close();
  $("whoami").textContent = "";
  $("deleteAccount").disabled = true;
  line("sys", "account deleted");
}

$("deleteAccount").onclick = () => deleteAccount().catch((e) => line("err", esc(e.message)));
$("login").onclick = () => authenticate("/api/v1/auth/login");
$("register").onclick = () => authenticate("/api/v1/auth/register");
$("connect").onclick = () => connect().catch((e) => line("err", esc(e.message)));
$("disconnect").onclick = () => socket?.close();
$("send").onclick = send;
$("attach").onclick = () => $("file").click();
$("file").onchange = (e) => {
  upload(e.target.files).catch((err) => line("err", esc(err.message)));
  e.target.value = "";
};

// Paste an image straight from the clipboard.
$("body").onpaste = (e) => {
  const files = [...e.clipboardData.files];
  if (files.length) {
    e.preventDefault();
    upload(files).catch((err) => line("err", esc(err.message)));
  }
};
$("body").onkeydown = (e) => { if (e.key === "Enter") send(); };
</script>
</body>
