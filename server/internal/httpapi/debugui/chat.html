  Developer test harness, not the product. It exists to prove the websocket
  path works and to be readable when something breaks. The real client is
  client-web, and none of this carries over to it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVoxa debug client</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: Canvas;
    --fg: CanvasText;
    --line: color-mix(in srgb, CanvasText 25%, Canvas);
    --muted: color-mix(in srgb, CanvasText 55%, Canvas);
  }
  body {
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0; padding: 1rem;
    background: var(--bg); color: var(--fg);
    max-width: 60rem;
  }
  h1 { font-size: 1rem; font-weight: 600; margin: 0 0 1rem; }
  fieldset { border: 1px solid var(--line); margin: 0 0 1rem; padding: .75rem; }
  legend { color: var(--muted); padding: 0 .35rem; }
  label { display: block; margin-bottom: .5rem; }
  input, button, select {
    font: inherit; padding: .35rem .5rem;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line);
  }
  input { width: 100%; max-width: 24rem; }
  button { cursor: pointer; }
  #log {
    border: 1px solid var(--line); height: 24rem;
    overflow-y: auto; padding: .5rem; margin-bottom: .5rem;
  }
  .msg { margin-bottom: .25rem; word-wrap: break-word; }
  .who { font-weight: 600; }
  .at { color: var(--muted); font-size: .85em; }
  .sys { color: var(--muted); font-style: italic; }
  .err { color: #c0392b; }
  @media (prefers-color-scheme: dark) { .err { color: #ff6b5a; } }
  #composer { display: flex; gap: .5rem; }
  #composer input { flex: 1; max-width: none; }
  #status { color: var(--muted); margin-left: .5rem; }
  #whoami { color: var(--muted); margin-left: .5rem; font-weight: 400; }
  #participants { list-style: none; margin: .5rem 0 0; padding: 0; }
  #participants li { padding: .15rem 0; }
  .speaking { font-weight: 600; }
  .ptt-hint { color: var(--muted); font-size: .85em; }
  #screens { display: grid; gap: .5rem; margin-top: .5rem; }
  #screens figure { margin: 0; border: 1px solid var(--line); }
  #screens video { width: 100%; display: block; background: #000; }
  #screens figcaption { padding: .25rem .5rem; color: var(--muted); font-size: .85em; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-bottom: .5rem; }
  .row label { margin: 0; }
  .num { width: 6rem; }
  #customBox[hidden] { display: none; }
</style>
</head>
<body>

<h1>OpenVoxa debug client <span id="status">disconnected</span> <span id="whoami"></span></h1>

<fieldset>
  <legend>sign in</legend>
  <label>username <input id="username" value="ryan" autocomplete="username"></label>
  <label>password <input id="password" type="password" autocomplete="current-password"></label>
  <button id="login">Log in</button>
  <button id="register">Register</button>
</fieldset>

<fieldset>
  <legend>channel</legend>
  <select id="channel"></select>
  <button id="connect" disabled>Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
</fieldset>

<fieldset>
  <legend>voice</legend>
  <select id="voiceChannel"></select>
  <button id="joinVoice" disabled>Join</button>
  <button id="leaveVoice" disabled>Leave</button>
  <button id="muteToggle" disabled>Mute</button>
  <label style="margin-top:.5rem">
    <input type="checkbox" id="pttMode"> push-to-talk
    <span class="ptt-hint">(hold Space while this page has focus)</span>
  </label>
  <ul id="participants"></ul>
</fieldset>

<fieldset>
  <legend>screen share</legend>

  <div class="row">
    <select id="preset">
      <option value="1280x720x30x2500">720p 30fps</option>
      <option value="1920x1080x30x4000" selected>1080p 30fps</option>
      <option value="1920x1080x60x8000">1080p 60fps</option>
      <option value="2560x1440x60x14000">1440p 60fps</option>
      <option value="3840x2160x30x20000">4K 30fps</option>
      <option value="custom">Custom</option>
    </select>

    <select id="priority" title="What to sacrifice when bandwidth runs short">
      <option value="maintain-resolution">Prioritise detail</option>
      <option value="maintain-framerate">Prioritise motion</option>
    </select>

    <label><input type="checkbox" id="shareAudio" checked> share audio</label>
  </div>

  <div class="row" id="customBox" hidden>
    <label>w <input class="num" type="number" id="cw" value="1920" min="160" max="7680"></label>
    <label>h <input class="num" type="number" id="ch" value="1080" min="120" max="4320"></label>
    <label>fps <input class="num" type="number" id="cf" value="60" min="1" max="240"></label>
    <label>kbps <input class="num" type="number" id="cb" value="8000" min="100" max="100000"></label>
  </div>

  <div class="row">
    <button id="startShare" disabled>Share screen</button>
    <button id="stopShare" disabled>Stop sharing</button>
    <span id="shareStatus" class="ptt-hint"></span>
  </div>

  <div id="screens"></div>
</fieldset>

<div id="log" aria-live="polite"></div>

<div id="composer">
  <input id="body" placeholder="Message" disabled autocomplete="off">
  <button id="send" disabled>Send</button>
</div>

<script>
const api = location.origin;
let token = null;
let socket = null;

const $ = (id) => document.getElementById(id);
const logEl = $("log");

function line(cls, html) {
  const div = document.createElement("div");
  div.className = cls;
  div.innerHTML = html;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

// Everything from the server is treated as untrusted text. Message bodies
// are other people's input and must never be injected as HTML.
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

function renderMessage(m) {
  const when = new Date(m.created_at).toLocaleTimeString();
  line("msg",
    `<span class="at">${esc(when)}</span> ` +
    `<span class="who">${esc(m.username || "[deleted]")}</span>: ${esc(m.body)}`);
}

async function call(path, options = {}) {
  const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
  if (token) headers["Authorization"] = `Bearer ${token}`;

  const res = await fetch(api + path, { ...options, headers });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;

  if (!res.ok) throw new Error(data?.error || res.statusText);
  return data;
}

async function authenticate(path) {
  try {
    const data = await call(path, {
      method: "POST",
      body: JSON.stringify({
        username: $("username").value,
        password: $("password").value,
        device_name: "debug-client"
      })
    });
    token = data.token;
    $("whoami").textContent = `${data.username} (${data.role})`;
    line("sys", `signed in as ${esc(data.username)}, role ${esc(data.role)}`);
    await loadChannels();
  } catch (err) {
    line("err", `auth failed: ${esc(err.message)}`);
  }
}

async function loadChannels() {
  const channels = await call("/api/v1/channels");

  const voiceSelect = $("voiceChannel");
  voiceSelect.innerHTML = "";
  for (const c of channels.filter((c) => c.kind === "voice")) {
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.dataset.forcePtt = c.force_ptt ? "1" : "";
    opt.textContent =
      `${c.name}${c.can_post ? "" : " (listen only)"}${c.force_ptt ? " [PTT required]" : ""}`;
    voiceSelect.appendChild(opt);
  }
  $("joinVoice").disabled = voiceSelect.options.length === 0;

  const select = $("channel");
  select.innerHTML = "";

  for (const c of channels.filter((c) => c.kind === "text")) {
    const opt = document.createElement("option");
    opt.value = c.id;
    const access = c.can_post ? "can post" : "read only";
    opt.textContent =
      `${c.name} (${c.encrypted ? "encrypted" : "plaintext"}, kept ${c.retention}, ${access})`;
    select.appendChild(opt);
  }

  $("connect").disabled = select.options.length === 0;
}

async function connect() {
  const channelID = $("channel").value;

  // Two steps on purpose: browsers cannot set an Authorization header on a
  // websocket, so we trade the session token for a single-use ticket rather
  // than putting the token itself in a URL.
  const { ticket } = await call("/api/v1/ws/ticket", { method: "POST" });

  const url = new URL("/api/v1/ws", api);
  url.protocol = url.protocol.replace("http", "ws");
  url.searchParams.set("ticket", ticket);
  url.searchParams.set("channel", channelID);

  socket = new WebSocket(url);

  socket.onopen = () => {
    $("status").textContent = "connected";
    $("body").placeholder = "Message";
    $("connect").disabled = true;
    $("disconnect").disabled = false;
    $("body").disabled = false;
    $("send").disabled = false;
  };

  socket.onclose = () => {
    $("status").textContent = "disconnected";
    $("connect").disabled = false;
    $("disconnect").disabled = true;
    $("body").disabled = true;
    $("send").disabled = true;
    line("sys", "connection closed");
  };

  socket.onmessage = (event) => {
    const frame = JSON.parse(event.data);
    if (frame.type === "history") {
      logEl.innerHTML = "";
      line("sys", `${frame.messages.length} earlier message(s)`);
      frame.messages.forEach(renderMessage);

      // The server decides; this only reflects its answer in the UI.
      if (!frame.can_post) {
        line("sys", "you have read-only access to this channel");
        $("body").disabled = true;
        $("send").disabled = true;
        $("body").placeholder = "Read only";
      }
    } else if (frame.type === "message") {
      renderMessage(frame);
    } else if (frame.type === "error") {
      line("err", esc(frame.error));
    }
  };
}

function send() {
  const input = $("body");
  if (!input.value.trim() || !socket) return;
  socket.send(JSON.stringify({ type: "send", body: input.value }));
  input.value = "";
}

// ---------------------------------------------------------------- voice

let room = null;
let micTrack = null;
let pttActive = false;

function renderParticipants() {
  const ul = $("participants");
  ul.innerHTML = "";
  if (!room) return;

  const all = [room.localParticipant, ...room.remoteParticipants.values()];
  for (const p of all) {
    const li = document.createElement("li");
    const muted = ![...p.audioTrackPublications.values()].some(
      (pub) => pub.track && !pub.isMuted);
    li.textContent =
      `${p.name || p.identity}${p === room.localParticipant ? " (you)" : ""}` +
      `${muted ? " - muted" : ""}`;
    if (p.isSpeaking) li.className = "speaking";
    ul.appendChild(li);
  }
}

// ------------------------------------------------------- screen sharing

let screenTracks = [];

// Remote video elements, keyed by track SID so they can be removed cleanly.
const screenEls = new Map();

function shareSettings() {
  if ($("preset").value === "custom") {
    return {
      width: +$("cw").value,
      height: +$("ch").value,
      fps: +$("cf").value,
      kbps: +$("cb").value
    };
  }
  const [width, height, fps, kbps] = $("preset").value.split("x").map(Number);
  return { width, height, fps, kbps };
}

$("preset").onchange = () => {
  const custom = $("preset").value === "custom";
  $("customBox").hidden = !custom;

  // Seed the custom fields from whatever preset was last selected, so
  // "custom" starts from something sensible rather than blank.
  if (custom) return;
  const s = shareSettings();
  $("cw").value = s.width; $("ch").value = s.height;
  $("cf").value = s.fps;   $("cb").value = s.kbps;
};

async function startShare() {
  if (!room) return;
  const s = shareSettings();

  // createLocalScreenTracks triggers the browser's own picker. We cannot
  // skip it or preselect a window: the user choosing what to share is a
  // browser security guarantee, not something the page controls.
  screenTracks = await LivekitClient.createLocalScreenTracks({
    audio: $("shareAudio").checked,
    resolution: { width: s.width, height: s.height, frameRate: s.fps }
  });

  for (const track of screenTracks) {
    await room.localParticipant.publishTrack(track, {
      // Bitrate is the setting that actually decides quality. Resolution
      // without the bitrate to carry it just produces a blurry large
      // picture.
      videoEncoding: { maxBitrate: s.kbps * 1000, maxFramerate: s.fps },

      // Screen content compresses well and viewers are few, so one high
      // quality layer beats simulcast's three mediocre ones.
      simulcast: false,

      // Detail keeps text readable and drops frames; motion keeps the
      // frame rate and softens the picture. Right answer depends on
      // whether you are sharing a document or a game.
      degradationPreference: $("priority").value
    });

    // Fires when the user hits the browser's own "Stop sharing" bar, which
    // bypasses our button entirely.
    track.mediaStreamTrack.addEventListener("ended", () => stopShare());
  }

  $("startShare").disabled = true;
  $("stopShare").disabled = false;
  $("shareStatus").textContent =
    `sharing ${s.width}x${s.height} @ ${s.fps}fps, ${s.kbps} kbps`;
  line("sys", `started screen share at ${s.width}x${s.height} ${s.fps}fps`);
}

async function stopShare() {
  for (const track of screenTracks) {
    try {
      await room?.localParticipant.unpublishTrack(track, true);
    } catch { /* already gone */ }
    track.stop();
  }
  screenTracks = [];

  $("startShare").disabled = !room;
  $("stopShare").disabled = true;
  $("shareStatus").textContent = "";
}

function addScreen(track, participant) {
  const fig = document.createElement("figure");
  const cap = document.createElement("figcaption");
  cap.textContent = `${participant.name || participant.identity} - screen`;

  const el = track.attach();
  el.autoplay = true;
  el.playsInline = true;
  // Our own share would echo back as a feedback loop; muting the element
  // does not affect what remote participants hear.
  el.muted = true;

  fig.append(el, cap);
  $("screens").appendChild(fig);
  screenEls.set(track.sid, fig);
}

function removeScreen(track) {
  track.detach().forEach((el) => el.remove());
  screenEls.get(track.sid)?.remove();
  screenEls.delete(track.sid);
}

$("startShare").onclick = () => startShare().catch((e) => {
  // Cancelling the picker throws NotAllowedError. Not an error worth
  // shouting about.
  if (e.name !== "NotAllowedError") line("err", esc(e.message));
});
$("stopShare").onclick = () => stopShare();

// ------------------------------------------------------------------ voice

async function joinVoice() {
  const opt = $("voiceChannel").selectedOptions[0];
  const data = await call(`/api/v1/channels/${opt.value}/voice-token`, { method: "POST" });

  room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

  room
    .on(LivekitClient.RoomEvent.ParticipantConnected, renderParticipants)
    .on(LivekitClient.RoomEvent.ParticipantDisconnected, renderParticipants)
    .on(LivekitClient.RoomEvent.ActiveSpeakersChanged, renderParticipants)
    .on(LivekitClient.RoomEvent.TrackMuted, renderParticipants)
    .on(LivekitClient.RoomEvent.TrackUnmuted, renderParticipants)
    .on(LivekitClient.RoomEvent.Disconnected, () => {
      line("sys", "left voice");
      stopShare();
      room = null; micTrack = null;
      screenEls.forEach((fig) => fig.remove());
      screenEls.clear();
      renderParticipants();
      $("joinVoice").disabled = false;
      $("leaveVoice").disabled = true;
      $("muteToggle").disabled = true;
      $("startShare").disabled = true;
    })
    .on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      if (track.kind === "audio") {
        // Remote audio needs an element in the DOM to actually play.
        document.body.appendChild(track.attach());
      } else if (track.source === LivekitClient.Track.Source.ScreenShare) {
        addScreen(track, participant);
      }
    })
    .on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
      if (track.source === LivekitClient.Track.Source.ScreenShare) {
        removeScreen(track);
      } else {
        track.detach().forEach((el) => el.remove());
      }
    });

  await room.connect(data.url, data.token);
  line("sys", `joined voice: ${esc(opt.textContent)}`);

  if (data.force_ptt) {
    $("pttMode").checked = true;
    $("pttMode").disabled = true;
    line("sys", "this channel requires push-to-talk");
  } else {
    $("pttMode").disabled = false;
  }

  // Screen sharing rides on the same publish permission as the microphone.
  // Someone who may not speak may not stream either.
  $("startShare").disabled = !data.can_publish;

  if (data.can_publish) {
    micTrack = await LivekitClient.createLocalAudioTrack({
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    });
    await room.localParticipant.publishTrack(micTrack);
    // In PTT mode the mic starts closed and opens only while held.
    if ($("pttMode").checked) await micTrack.mute();
    $("muteToggle").disabled = false;
  } else {
    line("sys", "listen-only: you lack permission to speak here");
  }

  $("joinVoice").disabled = true;
  $("leaveVoice").disabled = false;
  renderParticipants();
}

async function setMuted(muted) {
  if (!micTrack) return;
  muted ? await micTrack.mute() : await micTrack.unmute();
  $("muteToggle").textContent = muted ? "Unmute" : "Mute";
  renderParticipants();
}

$("joinVoice").onclick = () => joinVoice().catch((e) => line("err", esc(e.message)));
$("leaveVoice").onclick = () => room?.disconnect();
$("muteToggle").onclick = () => setMuted(!micTrack?.isMuted);

$("pttMode").onchange = () => setMuted($("pttMode").checked);

// Push-to-talk. A real client puts this behind a global hotkey in Electron
// so it works when the window is not focused; a web page cannot do that.
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || !$("pttMode").checked || pttActive) return;
  if (e.target.tagName === "INPUT") return;
  e.preventDefault();
  pttActive = true;
  setMuted(false);
});

document.addEventListener("keyup", (e) => {
  if (e.code !== "Space" || !pttActive) return;
  pttActive = false;
  setMuted(true);
});

$("login").onclick = () => authenticate("/api/v1/auth/login");
$("register").onclick = () => authenticate("/api/v1/auth/register");
$("connect").onclick = () => connect().catch((e) => line("err", esc(e.message)));
$("disconnect").onclick = () => socket?.close();
$("send").onclick = send;
$("body").onkeydown = (e) => { if (e.key === "Enter") send(); };
</script>
</body>
</html>
