<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>OpenVoxa</title>
  <link rel="stylesheet" href="pane.css">
</head>
<body>
  <nav class="pane" aria-label="Servers">
    <ul id="servers"></ul>
    <button id="add" class="server-icon add" title="Add a Server" aria-label="Add a Server">+</button>
  </nav>
  <main id="content" hidden>
    <form id="add-form" class="card" hidden>
      <h1>Add a Server</h1>
      <p class="muted">Paste the address of an OpenVoxa server. Each server has its own account, so you sign in or sign up once it opens.</p>
      <label>Server Address
        <input id="address" type="text" placeholder="openvoxa.example.com" autocomplete="off" spellcheck="false" required>
      </label>
      <p id="add-error" class="error" hidden></p>
      <div class="actions">
        <button type="submit" id="add-submit" class="primary">Add Server</button>
        <button type="button" id="add-cancel" class="outline">Cancel</button>
      </div>
    </form>
    <div id="load-error" class="card" hidden>
      <h1>Couldn't Load Server</h1>
      <p id="load-error-text" class="muted"></p>
      <div class="actions">
        <button type="button" id="retry" class="primary">Try Again</button>
      </div>
    </div>
  </main>
  <script src="pane.js"></script>
</body>
</html>
