<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>OpenVoxa</title>
  <link rel="stylesheet" href="pane.css">
</head>
<body>
  <nav class="pane" aria-label="Servers">
    <ul id="servers"></ul>
    <button id="add" class="server-icon add" title="Add a Server" aria-label="Add a Server">+</button>
  </nav>
  <main id="content" hidden>
    <form id="add-form" class="card" hidden>
      <h1>Add a Server</h1>
      <p class="muted">Paste the address of an OpenVoxa server. Each server has its own account, so you sign in or sign up once it opens.</p>
      <label>Server Address
        <input id="address" type="text" placeholder="openvoxa.example.com" autocomplete="off" spellcheck="false" required>
      </label>
      <p id="add-error" class="error" hidden></p>
      <div class="actions">
        <button type="submit" id="add-submit" class="primary">Add Server</button>
        <button type="button" id="add-cancel" class="outline">Cancel</button>
      </div>
    </form>
    <div id="load-error" class="card" hidden>
      <h1>Couldn't Load Server</h1>
      <p id="load-error-text" class="muted"></p>
      <div class="actions">
        <button type="button" id="retry" class="primary">Try Again</button>
      </div>
    </div>
    <div id="share" class="card wide" role="dialog" aria-labelledby="share-title" hidden>
      <h1 id="share-title">Share Your Screen</h1>
      <p id="share-host" class="muted"></p>
      <div class="tabs" role="tablist">
        <button type="button" id="tab-screens" role="tab" class="on">Screens</button>
        <button type="button" id="tab-windows" role="tab">Windows</button>
      </div>
      <ul id="sources" class="sources"></ul>
      <p id="sources-empty" class="muted" hidden></p>
      <div class="share-foot">
        <label class="check" id="sound-label">
          <input type="checkbox" id="sound" checked>
          <span>Share Sound</span>
        </label>
        <p id="sound-note" class="muted note" hidden></p>
        <div class="actions">
          <button type="button" id="share-cancel" class="outline">Cancel</button>
          <button type="button" id="share-go" class="primary" disabled>Share</button>
        </div>
      </div>
    </div>
  </main>
  <script src="pane.js"></script>
</body>
</html>
