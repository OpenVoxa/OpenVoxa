# Local development only. The credentials in here are deliberately obvious
# so nobody mistakes them for something safe to deploy.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openvoxa
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: openvoxa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvoxa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # TODO: pin to a specific tag once we settle on a version.
  livekit:
    image: livekit/livekit-server:latest
    # --node-ip MUST be the address clients can actually reach. LiveKit
    # advertises it as the destination for RTP, so a wrong value here gives
    # you a connection that establishes and then carries no audio. This is
    # the single most common self-hosting mistake.
    command: --config /etc/livekit.yaml --node-ip 10.0.3.9
    ports:
      - "7880:7880"       # WebSocket signalling
      - "7881:7881"       # TCP fallback for media
      - "50000-50100:50000-50100/udp"  # RTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  server:
    build:
      context: ../server
    environment:
      OPENVOXA_LISTEN_ADDR: ":8080"
      OPENVOXA_DATABASE_URL: "postgres://openvoxa:devpassword@postgres:5432/openvoxa?sslmode=disable"

      # Serves the throwaway test client at /debug/chat.html.
      # Remove this line for any deployment that is not your own LAN.
      OPENVOXA_DEBUG_UI: "true"

      # Must be reachable from the BROWSER, not from this container.
      OPENVOXA_LIVEKIT_URL: "ws://10.0.3.9:7880"
      OPENVOXA_LIVEKIT_API_KEY: "APIVdQrViCp7oaf"
      OPENVOXA_LIVEKIT_API_SECRET: "qiLA147ZnieDwaf7AAjOLrrn8dmIC3I3eYV61wp8eWOC"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
