#
# Keys come from the LIVEKIT_KEYS environment variable, set in
# docker-compose.yml from your .env, so no secrets live in this file.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100

  # The node IP is passed explicitly on the command line, so LiveKit should
  # not try to discover an address via STUN.
  use_external_ip: false

  # Offer the host's own addresses as well as the node IP. With LiveKit on
  # the host network (docker-compose.yml) that includes the LAN address,
  # so clients at home connect directly even when LIVEKIT_NODE_IP is the
  # public IP; no hairpin NAT needed. Also lists Docker's bridge addresses,
  # which clients simply fail to reach. To list only your LAN:
  #   ips:
  #     includes: [192.168.1.0/24]
  advertise_internal_ip: true

logging:
  level: info

# Speaking indicator (Ryan, 2026-11-04: the green ring lagged ~1 s both
# ways). LiveKit's defaults send speaker updates every 400 ms, smoothed
# over 2 updates. Faster updates make the ring follow speech closely;
# smoothing stays at 2 so short pauses read as one stretch (Ryan, VA2).
audio:
  update_interval: 200
  smooth_intervals: 2
