# Development configuration.
#
# The key below is a placeholder. Generate your own before this is reachable
# from anywhere, and keep the secret out of git:
#
#   docker run --rm livekit/livekit-server generate-keys
#
# Format is  <apiKey>: <apiSecret>  and both must match the values in the
# server's OPENVOXA_LIVEKIT_API_KEY / _API_SECRET.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100

  # The VM reaches clients over the LAN directly, so LiveKit should not try
  # to discover a public address via STUN.
  use_external_ip: false

keys:
  APIVdQrViCp7oaf: qiLA147ZnieDwaf7AAjOLrrn8dmIC3I3eYV61wp8eWOC

logging:
  level: info
