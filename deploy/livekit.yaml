#
# Keys come from the LIVEKIT_KEYS environment variable, set in
# docker-compose.yml from your .env, so no secrets live in this file.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100

  # The node IP is passed explicitly on the command line, so LiveKit should
  # not try to discover an address via STUN.
  use_external_ip: false

logging:
  level: info
